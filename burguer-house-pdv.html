<head>
  <meta charset="UTF-8">

  <title>Burguer House</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  
  <style>
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; -webkit-tap-highlight-color: transparent; }

    /* BURGUER HOUSE — identidade visual compartilhada com o cardápio */
    :root { --bh-red:#B71C1C; --bh-charcoal:#1E1E1E; --bh-mustard:#FFC107; --bh-paper:#F5F5F5; }
    body { background:var(--bh-charcoal) !important; color:var(--bh-paper); font-family:Arial, Helvetica, sans-serif; }
    #root { background:var(--bh-charcoal); }
    .bg-zinc-950 { background:var(--bh-charcoal) !important; }
    .bg-zinc-900 { background:#241f1e !important; }
    .bg-zinc-800 { background:#342727 !important; }
    .bg-amber-500 { background:var(--bh-mustard) !important; color:var(--bh-charcoal) !important; }
    .text-amber-500, .text-yellow-400 { color:var(--bh-mustard) !important; }
    .bg-white { background:var(--bh-paper) !important; color:var(--bh-charcoal) !important; }
    .bg-zinc-50 { background:#eee8df !important; }
    .text-zinc-400, .text-zinc-500 { color:#cdbfb0 !important; }
    .border-zinc-800, .border-zinc-700, .border-zinc-200 { border-color:#5a3330 !important; }
    header { background:linear-gradient(145deg,#8f1717,#1e1e1e 75%) !important; border-bottom:4px solid var(--bh-mustard); }
    header h1, h1, h2, h3, h4 { font-family:Georgia, 'Times New Roman', serif; }
    header img { mix-blend-mode:screen; filter:drop-shadow(0 8px 18px rgba(0,0,0,.45)); }
    input, textarea, select { background:var(--bh-paper) !important; color:var(--bh-charcoal) !important; border-color:#c7aa80 !important; }
    .bg-red-600, .bg-red-500 { background:var(--bh-red) !important; }
    .rounded-3xl { border-radius:18px !important; }
  </style>
</head>

    import { getFirestore, collection, onSnapshot, getDocs, writeBatch, addDoc, deleteDoc, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // Chaves oficiais da Burguer House
    const firebaseConfig = {
      apiKey: "AIzaSyAzCDS15N2e8hdP5wrQEzDNvZKBOAdeYjw",
      authDomain: "malaguti-brothers.firebaseapp.com",
      projectId: "malaguti-brothers",
      storageBucket: "malaguti-brothers.firebasestorage.app",
      messagingSenderId: "622848104847",
      appId: "1:622848104847:web:5874e22dab246855bb93fa"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      // O PDV não usa login anônimo: ele exige e-mail e senha do Firebase.

      window.firebaseAPI = {
        auth,
        onAuthStateChanged,
        signInWithEmailAndPassword, signOut,
        db: getFirestore(app),
        collection, onSnapshot, getDocs, writeBatch, addDoc, deleteDoc, doc, updateDoc, setDoc
      };
      window.dispatchEvent(new Event('firebase-ready'));
    } catch (e) {
      console.error("Erro ao inicializar Firebase:", e);
    }
  </script>

    const playBeep = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
        oscillator.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.4);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.4);
      } catch (e) {
        console.log("Áudio bloqueado:", e);
      }
    };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 400; const MAX_HEIGHT = 400;
            let width = img.width; let height = img.height;
            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            setNewProduct(prev => ({ ...prev, imageUrl: dataUrl }));
          };
          img.src = uploadEvent.target.result;
        };
        reader.readAsDataURL(file);
      };

        const subtotal = order.subtotal !== undefined ? order.subtotal : (order.total - (order.deliveryFee || 0));
        const fee = order.deliveryFee !== undefined ? order.deliveryFee : 0;
        let html = `
          <!DOCTYPE html>
          <html><head><title>Impressão</title>
          <style>
            body { font-family: monospace; padding: 0; margin: 0; font-size: 14px; color: black; background: white; }
            .container { padding: 10px; width: 80mm; margin: 0 auto; }
            h2 { font-size: 18px; margin: 0; text-align: center; }
            .text-center { text-align: center; }
            .border-b { border-bottom: 1px dashed black; margin-bottom: 10px; padding-bottom: 10px; }
            table { width: 100%; margin: 10px 0; border-collapse: collapse; }
            td { vertical-align: top; padding: 3px 0; }
            .text-right { text-align: right; }
            .address-box { margin-top: 15px; border-top: 2px dashed black; padding-top: 10px; }
            .address-title { font-size: 12px; font-weight: bold; margin-bottom: 2px; }
            .address-text { font-size: 16px; font-weight: bold; line-height: 1.2; }
          </style>
          </head><body>
            <div class="container">
              <div class="text-center border-b">
                <h2>BURGUER HOUSE</h2>
                <p style="margin:5px 0 0 0;">Pedido #${order.id.substring(0, 5).toUpperCase()}</p>
                <p style="margin:2px 0 0 0;">${new Date(order.createdAt).toLocaleString('pt-BR')}</p>
              </div>
              <div class="border-b" style="font-size: 16px;">
                <p style="margin:3px 0;"><strong>Cliente:</strong> ${order.customerName}</p>
                ${order.customerPhone ? `<p style="margin:3px 0;"><strong>Tel:</strong> ${order.customerPhone}</p>` : ''}
                <p style="margin:3px 0;"><strong>Pagamento:</strong> <span style="font-size: 18px; font-weight: bold;">${order.paymentMethod || 'Pix'}</span></p>
              </div>
              <table>
                ${order.items.map(item => `
                  <tr>
                    <td style="width: 15%; font-size: 15px;"><strong>${item.quantity}x</strong></td>
                    <td style="font-size: 15px;">
                      ${item.name}
                      ${item.addons && item.addons.length > 0 ? `<br><span style="font-size:12px; color:#444;">+ ${item.addons.map(a => a.name).join(', ')}</span>` : ''}
                      ${item.note ? `<br><span style="font-size:13px; font-weight:bold; color:#b91c1c;">⚠️ Obs: ${item.note}</span>` : ''}
                    </td>
                    <td class="text-right" style="font-size: 15px;">R$${(item.price * item.quantity).toFixed(2)}</td>
                  </tr>
                `).join('')}
              </table>
              <div style="border-top: 1px dashed black; margin-top: 10px; padding-top: 5px; font-size: 14px;">
                <div style="display: flex; justify-content: space-between;"><span>Subtotal:</span><span>R$ ${subtotal.toFixed(2)}</span></div>
                <div style="display: flex; justify-content: space-between;"><span>Taxa Entrega:</span><span>R$ ${fee.toFixed(2)}</span></div>
              </div>
              <div class="text-right" style="margin-top: 5px; border-top: 1px dashed black; padding-top: 5px; font-size: 18px; font-weight: bold;">
                TOTAL: R$ ${order.total.toFixed(2)}
              </div>
              ${order.customerAddress ? `
                <div class="address-box">
                  <div class="address-title">ENDEREÇO DE ENTREGA:</div>
                  <div class="address-text">${order.customerAddress}</div>
                </div>
              ` : ''}
            </div>
          </body></html>
        `;
        let iframe = document.getElementById('printFrame');
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.id = 'printFrame';
          iframe.style.position = 'fixed'; iframe.style.right = '0'; iframe.style.bottom = '0';
          iframe.style.width = '0'; iframe.style.height = '0'; iframe.style.border = '0';
          document.body.appendChild(iframe);
        }
        iframe.contentWindow.document.open();
        iframe.contentWindow.document.write(html);
        iframe.contentWindow.document.close();
        setTimeout(() => { iframe.contentWindow.focus(); iframe.contentWindow.print(); }, 500);
      };

      const predefinedCatOrder = ['Lanche', 'Lanche Gourmet', 'Bebidas', 'Sobremesas'];
      
      const sortedCustomCategories = [...customCategories].sort((a, b) => {
        const indexA = predefinedCatOrder.indexOf(a);
        const indexB = predefinedCatOrder.indexOf(b);
        if (indexA !== -1 && indexB !== -1) return indexA - indexB; 
        if (indexA !== -1) return -1; 
        if (indexB !== -1) return 1;  
        return 0; 
      });

      const productCategories = products.map(p => String(p.category || '').trim()).filter(Boolean);
      const categoriesForManagement = [...new Set([...sortedCustomCategories, ...productCategories])];
      const displayCategories = [...categoriesForManagement, 'Todos'];

      const filteredProducts = (activeCategory === 'Todos' ? products : products.filter(p => p.category === activeCategory))
        .filter(p => !p.paused);

      // CÁLCULO INTELIGENTE DO CAIXA: Puxa desde o momento em que o último caixa foi fechado
      const closedCashRegistersList = cashRegisters.filter(c => c.status === 'fechado');
      const lastClosedTime = closedCashRegistersList.length > 0 ? Math.max(...closedCashRegistersList.map(c => c.closedAt)) : new Date().setHours(0,0,0,0);

      const pdvDisplayOrders = orders.filter(o => o.createdAt >= new Date().setHours(0,0,0,0));

      // As vendas do caixa agora absorvem qualquer pedido feito no "limbo" enquanto o caixa estava fechado!
      const activeSessionOrdersValid = currentCash ? orders.filter(o => o.createdAt > lastClosedTime && o.status !== 'cancelado') : [];
      
      const sessionTotal = activeSessionOrdersValid.reduce((acc, o) => acc + (o.total || 0), 0);
      const sessionPix = activeSessionOrdersValid.filter(o => o.paymentMethod === 'Pix').reduce((acc, o) => acc + (o.total || 0), 0);
      const sessionCard = activeSessionOrdersValid.filter(o => o.paymentMethod === 'Cartão').reduce((acc, o) => acc + (o.total || 0), 0);
      const sessionCash = activeSessionOrdersValid.filter(o => o.paymentMethod === 'Dinheiro').reduce((acc, o) => acc + (o.total || 0), 0);
      
      const totalWithdrawals = (currentCash?.withdrawals || []).reduce((acc, w) => acc + w.amount, 0);
      const expectedCashInDrawer = (currentCash?.openingChange || 0) + sessionCash - totalWithdrawals;

      const motoboyStats = {};
      activeSessionOrdersValid.forEach(o => {
        if (o.motoboy) {
          if (!motoboyStats[o.motoboy]) motoboyStats[o.motoboy] = { count: 0, fees: 0, cashCollected: 0 };
          motoboyStats[o.motoboy].count += 1;
          motoboyStats[o.motoboy].fees += (o.deliveryFee || 0);
          if (o.paymentMethod === 'Dinheiro') {
            motoboyStats[o.motoboy].cashCollected += (o.total || 0);
          }
        }
      });

      const closedCashRegisters = cashRegisters.filter(c => c.status === 'fechado');
      const monthlyRevenue = closedCashRegisters.reduce((acc, c) => acc + (c.totalSales || 0), 0);

      const filteredOrdersForAnalysis = orders.filter(o => {
        if (!analysisStartDate && !analysisEndDate) return true;
        const d = new Date(o.createdAt);
        const orderDateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        
        if (analysisStartDate && orderDateStr < analysisStartDate) return false;
        if (analysisEndDate && orderDateStr > analysisEndDate) return false;
        return true;
      });

      const validOrdersForAnalysis = filteredOrdersForAnalysis.filter(o => o.status !== 'cancelado');
      const canceledOrdersForAnalysis = filteredOrdersForAnalysis.filter(o => o.status === 'cancelado');
      const periodCanceledRevenue = canceledOrdersForAnalysis.reduce((acc, o) => acc + (o.total || 0), 0);
      const periodCanceledCount = canceledOrdersForAnalysis.length;

      const globalProductStats = {};
      const categorySalesStats = {};
      const periodSeasonalityStats = {};
      let periodTotalRevenue = 0;

      validOrdersForAnalysis.forEach(o => {
        periodTotalRevenue += (o.total || 0);
        const orderDate = new Date(o.createdAt);
        const monthKey = orderDate.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
        
        if (!periodSeasonalityStats[monthKey]) periodSeasonalityStats[monthKey] = { revenue: 0, count: 0 };
        periodSeasonalityStats[monthKey].revenue += (o.total || 0);
        periodSeasonalityStats[monthKey].count += 1;

        if (o.items) {
          o.items.forEach(item => {
            if (!globalProductStats[item.name]) globalProductStats[item.name] = { qty: 0, revenue: 0 };
            globalProductStats[item.name].qty += item.quantity;
            globalProductStats[item.name].revenue += (item.price * item.quantity);

            const matchedProd = products.find(p => p.name === item.name);
            const cat = matchedProd ? matchedProd.category : 'Outros';
            if (!categorySalesStats[cat]) categorySalesStats[cat] = { qty: 0, revenue: 0 };
            categorySalesStats[cat].qty += item.quantity;
            categorySalesStats[cat].revenue += (item.price * item.quantity);
          });
        }
      });

      const sortedGlobalProducts = Object.entries(globalProductStats).sort((a, b) => b[1].qty - a[1].qty);
      const sortedCategories = Object.entries(categorySalesStats).sort((a, b) => b[1].revenue - a[1].revenue);
      const sortedSeasonality = Object.entries(periodSeasonalityStats).sort((a, b) => new Date(b[0]) - new Date(a[0]));

      const uniqueClientsMap = {};
      orders.forEach(o => {
        if (o.customerPhone) {
          const phoneClean = o.customerPhone.trim();
          if (!uniqueClientsMap[phoneClean]) {
            uniqueClientsMap[phoneClean] = { name: o.customerName, phone: phoneClean, address: o.customerAddress, ordersCount: 0, lastOrderAt: 0 };
          }
          uniqueClientsMap[phoneClean].ordersCount += 1;
          if (o.createdAt > uniqueClientsMap[phoneClean].lastOrderAt) {
            uniqueClientsMap[phoneClean].lastOrderAt = o.createdAt;
            uniqueClientsMap[phoneClean].name = o.customerName;
            uniqueClientsMap[phoneClean].address = o.customerAddress;
          }
        }
      });

      const normalizePhone = (raw) => {
        if (!raw) return null;
        const digits = String(raw).replace(/\D/g, '');
        if (digits.length === 13 && digits.startsWith('55')) return digits;
        if (digits.length === 11) return '55' + digits;
        if (digits.length === 10) return '55' + digits.slice(0, 2) + '9' + digits.slice(2);
        return digits || null;
      };

      const generateCouponCode = (type, client) => {
        const prefix = { birthday: 'NIVER', winback: 'VOLTA', loyal: 'FIEL', manual: 'CUPOM' }[type] || 'CUPOM';
        const namePart = String(client?.name || 'CLIENTE').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 5) || 'CLIENTE';
        const random = (window.crypto?.getRandomValues ? Array.from(window.crypto.getRandomValues(new Uint8Array(3))).map(n => n.toString(36).toUpperCase()).join('').slice(0, 4) : Math.random().toString(36).slice(2, 6).toUpperCase());
        return `${prefix}-${namePart}-${random}`;
      };

      const parseOrderDate = (value) => {
        if (!value) return null;
        if (typeof value === 'number') return new Date(value);
        if (value.toDate) return value.toDate();
        return null;
      };

      // Inclui no CRM clientes que ainda não aparecem na lista de pedidos.
      crmCustomers.forEach(customer => {
        const normalized = customer.phoneNormalized || normalizePhone(customer.phone);
        if (!normalized) return;
        const alreadyListed = Object.keys(uniqueClientsMap).some(key => normalizePhone(key) === normalized);
        if (!alreadyListed) {
          uniqueClientsMap[normalized] = {
            name: customer.name || '',
            phone: customer.phone || normalized,
            address: Array.isArray(customer.addresses) && customer.addresses.length ? customer.addresses[customer.addresses.length - 1].value : '',
            ordersCount: Number(customer.totalOrders) || 0,
            lastOrderAt: customer.lastOrderAt || 0
          };
        }
      });

      const upsertCustomerFromOrder = async (order) => {
        const phone = normalizePhone(order.customerPhone);
        if (!phone) return;
        const { db, doc, getDoc, setDoc } = window.firebaseAPI;
        const ref = doc(db, 'customers', phone);
        const existingSnap = await getDoc(ref);
        const existing = existingSnap.exists() ? existingSnap.data() : {};
        const created = parseOrderDate(order.createdAt) || new Date();
        const oldTotalOrders = Number(existing.totalOrders) || 0;
        const oldTotalSpent = Number(existing.totalSpent) || 0;
        const totalOrders = oldTotalOrders + 1;
        const totalSpent = Number((oldTotalSpent + (Number(order.total) || 0)).toFixed(2));
        const addresses = Array.isArray(existing.addresses) ? [...existing.addresses] : [];
        if (order.customerAddress && !addresses.some(a => a.value === order.customerAddress)) {
          addresses.push({ label: 'Entrega', value: order.customerAddress, lastUsedAt: created });
        }
        await setDoc(ref, {
          name: order.customerName || existing.name || '',
          phone: order.customerPhone || existing.phone || '',
          phoneNormalized: phone,
          addresses,
          totalOrders,
          totalSpent,
          avgTicket: Number((totalSpent / totalOrders).toFixed(2)),
          firstOrderAt: existing.firstOrderAt || created,
          lastOrderAt: created,
          source: existing.source || order.source || 'desconhecido',
          updatedAt: new Date()
        }, { merge: true });
      };

      const exportCustomersCsv = () => {
        const rows = crmCustomers.map(c => ({
          nome: c.name || '',
          telefone: c.phone || c.phoneNormalized || '',
          aniversario: c.birthday || '',
          consentimento: c.birthdayConsent ? 'sim' : 'nao',
          pedidos: c.totalOrders || 0,
          totalGasto: Number(c.totalSpent || 0).toFixed(2),
          ticketMedio: Number(c.avgTicket || 0).toFixed(2),
          ultimoPedido: c.lastOrderAt?.toDate ? c.lastOrderAt.toDate().toLocaleDateString('pt-BR') : '',
          observacoes: c.notes || ''
        }));
        if (!rows.length) return alert('Nenhum cliente para exportar.');
        const columns = Object.keys(rows[0]);
        const csv = [columns.join(';'), ...rows.map(row => columns.map(col => `"${String(row[col]).replace(/"/g, '""')}"`).join(';'))].join('\n');
        const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob); const a = document.createElement('a');
        a.href = url; a.download = `clientes-burguer-house-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); URL.revokeObjectURL(url);
      };

      const rebuildCustomers = async () => {
        const { db, collection, getDocs, writeBatch, doc } = window.firebaseAPI;
        const snap = await getDocs(collection(db, 'orders'));
        const map = new Map();

        snap.forEach(docSnap => {
          const order = docSnap.data();
          if (order.status === 'cancelado') return;
          const phone = normalizePhone(order.customerPhone);
          if (!phone) return;
          const created = parseOrderDate(order.createdAt);
          const total = Number(order.total) || 0;

          if (!map.has(phone)) {
            map.set(phone, {
              name: order.customerName || '',
              phone: order.customerPhone || '',
              phoneNormalized: phone,
              addresses: [],
              totalOrders: 0,
              totalSpent: 0,
              avgTicket: 0,
              firstOrderAt: created,
              lastOrderAt: created,
              source: order.source || 'desconhecido',
              updatedAt: new Date()
            });
          }

          const customer = map.get(phone);
          customer.totalOrders += 1;
          customer.totalSpent += total;
          if (created) {
            if (!customer.firstOrderAt || created < customer.firstOrderAt) customer.firstOrderAt = created;
            if (!customer.lastOrderAt || created > customer.lastOrderAt) customer.lastOrderAt = created;
          }
          if (order.customerAddress && !customer.addresses.some(a => a.value === order.customerAddress)) {
            customer.addresses.push({ label: 'Entrega', value: order.customerAddress, lastUsedAt: created || new Date() });
          }
          if (order.customerName) customer.name = order.customerName;
        });

        const batch = writeBatch(db);
        map.forEach((customer, phone) => {
          customer.totalSpent = Number(customer.totalSpent.toFixed(2));
          customer.avgTicket = customer.totalOrders
            ? Number((customer.totalSpent / customer.totalOrders).toFixed(2))
            : 0;
          batch.set(doc(db, 'customers', phone), customer, { merge: true });
        });
        await batch.commit();
        return map.size;
      };

      const getCustomerTags = (client) => {
        const tags = Array.isArray(client.tags) ? [...client.tags] : [];
        if ((Number(client.ordersCount) || 0) >= 2 && !tags.includes('Fiel')) tags.push('Fiel');
        if ((Number(client.daysAgo) || 0) >= 30 && !tags.includes('Sumido')) tags.push('Sumido');
        if (!client.ordersCount && !tags.includes('Novo')) tags.push('Novo');
        const monthDay = `${String(new Date().getMonth() + 1).padStart(2, '0')}-${String(new Date().getDate()).padStart(2, '0')}`;
        if (client.birthday === monthDay && !tags.includes('Aniversário')) tags.push('Aniversário');
        return tags.slice(0, 5);
      };

      const now = Date.now();
      const uniqueClients = Object.values(uniqueClientsMap).map(c => {
        const daysAgo = c.lastOrderAt ? Math.floor((now - c.lastOrderAt) / (1000 * 60 * 60 * 24)) : 0;
        const normalized = normalizePhone(c.phone);
        const crm = crmCustomers.find(item => item.phoneNormalized === normalized);
        return { ...c, ...(crm || {}), ordersCount: c.ordersCount, daysAgo };
      });
      uniqueClients.sort((a, b) => b.lastOrderAt - a.lastOrderAt);
      const filteredClientsByType = leadFilter === 'top' ? [...uniqueClients].sort((a, b) => (Number(b.totalSpent) || 0) - (Number(a.totalSpent) || 0)).slice(0, 10) : leadFilter === 'birthday'
        ? crmCustomers
            .filter(c => {
              const currentMonth = String(new Date().getMonth() + 1).padStart(2, '0');
              return typeof c.birthday === 'string' && c.birthday.slice(0, 2) === currentMonth;
            })
            .map(c => {
              const crmPhone = c.phoneNormalized || normalizePhone(c.phone) || c.id;
              const base = uniqueClients.find(item => normalizePhone(item.phone) === crmPhone);
              return {
                ...base,
                ...c,
                name: c.name || base?.name || 'Cliente sem nome',
                phone: c.phone || base?.phone || crmPhone || '',
                ordersCount: Number(c.totalOrders ?? base?.ordersCount ?? 0),
                daysAgo: c.lastOrderAt ? Math.floor((now - (c.lastOrderAt.toDate ? c.lastOrderAt.toDate().getTime() : c.lastOrderAt)) / (1000 * 60 * 60 * 24)) : (base?.daysAgo || 0)
              };
            })
        : uniqueClients.filter(c => {
            if (leadFilter === 'loyal') return c.ordersCount >= 2;
            if (leadFilter === 'churned') return c.daysAgo >= 30;
            return true;
          });
      const displayedClients = filteredClientsByType.filter(client => {
        const query = clientSearch.trim().toLowerCase();
        if (!query) return true;
        const digitsQuery = query.replace(/\D/g, '');
        const phoneText = String(client.phone || client.phoneNormalized || '');
        return String(client.name || '').toLowerCase().includes(query)
          || phoneText.toLowerCase().includes(query)
          || (digitsQuery.length > 0 && phoneText.replace(/\D/g, '').includes(digitsQuery));
      });

      const getCustomerPreferences = (client) => {
        const phone = client.phoneNormalized || normalizePhone(client.phone);
        const customerOrders = orders.filter(order => normalizePhone(order.customerPhone) === phone);
        const products = {};
        const addons = {};
        customerOrders.forEach(order => (order.items || []).forEach(item => {
          products[item.name] = (products[item.name] || 0) + (Number(item.quantity) || 0);
          (item.addons || []).forEach(addon => { addons[addon.name] = (addons[addon.name] || 0) + (Number(item.quantity) || 0); });
        }));
        return {
          products: Object.entries(products).sort((a, b) => b[1] - a[1]).slice(0, 3),
          addons: Object.entries(addons).sort((a, b) => b[1] - a[1]).slice(0, 3)
        };
      };

      return (
        <div className="min-h-screen relative pb-20 w-full overflow-x-hidden font-sans">
          
          <div className="fixed top-2 right-2 z-50 bg-zinc-800/80 p-1 rounded-full flex gap-1 border border-zinc-700 shadow-xl backdrop-blur-md">
            {view === 'pdv' ? (
              <button onClick={handleExitPdv} className="px-3 py-1.5 rounded-full text-[10px] font-bold uppercase transition-colors text-red-400">Sair do PDV ✖</button>
            ) : (
              <>
                <button onClick={() => setView('menu')} className="px-3 py-1.5 rounded-full text-[10px] font-bold uppercase transition-colors bg-amber-500 text-black">Cardápio</button>
                <button onClick={handlePdvAccess} className="px-3 py-1.5 rounded-full text-[10px] font-bold uppercase transition-colors text-zinc-400">PDV 🔒</button>
              </>
            )}
          </div>

          {!storeOpen && view === 'menu' && (
             <div className="bg-red-600 text-white text-center py-2.5 text-xs font-black tracking-wide uppercase shadow-md sticky top-0 z-[40] flex justify-center items-center gap-2">
               <span>🚫</span> Loja Fechada no momento
             </div>
          )}

          {trackedOrder && view === 'menu' && !orderSuccess && showTracker && (
            <div className="fixed bottom-24 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-zinc-900 border border-amber-500/50 shadow-[0_0_20px_rgba(245,158,11,0.2)] rounded-2xl p-4 z-40 flex items-center justify-between">
              <div>
                <p className="text-[10px] text-zinc-400 font-bold uppercase tracking-wider">Acompanhe seu Pedido</p>
                <p className="text-sm font-black text-amber-500 mt-0.5">
                  {trackedOrder.status === 'pendente' && '📝 Aguardando Confirmação'}
                  {trackedOrder.status === 'preparando' && '🍳 Sendo Preparado na Cozinha'}
                  {trackedOrder.status === 'finalizado' && '🛵 Saiu para Entrega'}
                  {trackedOrder.status === 'cancelado' && '🚫 Pedido Cancelado'}
                </p>
                {trackedOrder.status !== 'finalizado' && trackedOrder.status !== 'cancelado' && (
                  <p className="text-[11px] text-zinc-300 mt-1">⏳ Previsão: ~{trackedOrder.estMinutes} min</p>
                )}
              </div>
              <button onClick={() => setShowTracker(false)} className="bg-zinc-800 p-2 rounded-xl text-xs font-bold text-zinc-300">Ocultar</button>
            </div>
          )}

          {trackedOrder && view === 'menu' && !orderSuccess && !showTracker && (
            <button 
               onClick={() => setShowTracker(true)} 
               className="fixed bottom-24 right-4 z-40 bg-amber-500 text-zinc-950 p-4 rounded-full shadow-[0_10px_20px_rgba(245,158,11,0.4)] font-black flex items-center justify-center animate-bounce"
            >
              🛵
            </button>
          )}

          {orderSuccess && (
             <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                 <div className="bg-zinc-900 rounded-[2.5rem] p-8 max-w-sm w-full text-center border border-zinc-800 shadow-2xl relative overflow-hidden">
                     <div className="w-20 h-20 bg-green-500/20 text-green-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-5 shadow-[0_0_20px_rgba(34,197,94,0.3)]">
                         ✓
                     </div>
                     <h2 className="text-2xl font-black text-white mb-2 tracking-tight">Pedido Recebido! 🎉</h2>
                     <p className="text-zinc-400 text-sm mb-4 leading-relaxed">
                         Olá <strong>{orderSuccess.customerName}</strong>, seu pedido já está no nosso sistema. O tempo estimado de entrega é de aproximadamente <strong className="text-amber-500">30 a 45 minutos</strong>.
                     </p>

                     {orderSuccess.paymentMethod === 'Pix' && (
                         <div className="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-4 mb-6 text-left">
                             <p className="text-amber-500 text-xs font-black uppercase mb-2 text-center">⚠️ Falta só um detalhe!</p>

                          </div>
                        ))}
                        {sortedSeasonality.length === 0 && <p className="text-xs text-zinc-400 text-center py-6">Nenhum dado mensal validado.</p>}
                      </div>
                    </div>
                  </div>
                )}

                {pdvTab === 'config' && userRole === 'admin' && (
                  <div className="p-4 space-y-6">
                    
                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-zinc-200">
                      <h3 className="font-black text-xl mb-2">🏪 Status da Loja (Delivery)</h3>
                      <div className="flex items-center justify-between bg-zinc-50 border border-zinc-200 rounded-2xl p-4">
                        <div>
                          <span className={`w-3 h-3 inline-block rounded-full mr-2 ${storeOpen ? 'bg-green-500' : 'bg-red-500'}`}></span>
                          <span className="font-bold text-zinc-800">{storeOpen ? 'Loja Aberta' : 'Loja Fechada'}</span>
                        </div>
                        <button type="button" onClick={handleToggleStore} className={`px-4 py-2 rounded-xl text-xs font-black text-white shadow-sm transition-transform active:scale-95 ${storeOpen ? 'bg-red-600' : 'bg-green-600'}`}>
                          {storeOpen ? 'Pausar Delivery' : 'Abrir Delivery'}
                        </button>
                      </div>
                      <p className="text-[10px] text-zinc-500 mt-2 leading-tight">Quando fechada, os clientes podem ver o cardápio, mas o botão de enviar pedido fica bloqueado.</p>
                    </div>

                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-zinc-200">
                      <h3 className="font-black text-xl mb-2">⚙️ Configurações Gerais</h3>
                      
                      <form onSubmit={handleSaveConfig} className="space-y-4">
                        <div>
                          <label className="block text-xs font-bold text-zinc-600 uppercase mb-1">Taxa de Entrega (R$)</label>
                          <input type="number" step="0.50" value={feeInput} onChange={(e) => setFeeInput(e.target.value)} className="w-full bg-zinc-50 border border-zinc-300 rounded-2xl px-4 py-3 font-bold text-base" required />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-zinc-600 uppercase mb-1">Chave Pix (Copia e Cola)</label>
                          <textarea value={pixInput} onChange={(e) => setPixInput(e.target.value)} className="w-full bg-zinc-50 border border-zinc-300 rounded-2xl px-4 py-3 font-mono text-xs h-14" required />
                        </div>
                        
                        <div>
                          <label className="block text-xs font-bold text-zinc-600 uppercase mb-1">Mensagem de "Saiu para Entrega" (WhatsApp)</label>
                          <textarea value={dispatchMsgInput} onChange={(e) => setDispatchMsgInput(e.target.value)} className="w-full bg-zinc-50 border border-zinc-300 rounded-2xl px-4 py-3 text-xs h-20 text-zinc-800" required />
                          <p className="text-[10px] text-zinc-500 mt-1">Use a tag <strong>[Nome]</strong> para incluir o nome do cliente automaticamente.</p>
                        </div>

                        <div className="pt-4 border-t border-zinc-200">
                           <h4 className="font-black text-sm text-zinc-800 flex items-center gap-2">🔐 Controle de Acesso</h4>
                           <p className="text-[10px] text-zinc-500 leading-tight mt-2">O acesso agora usa o Firebase Authentication. As senhas não são mais armazenadas nas configurações da loja.</p>
                        </div>

                        <button type="submit" className="w-full bg-zinc-900 text-white font-black py-3 rounded-2xl shadow-md">Salvar Alterações</button>
                      </form>
                    </div>

                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-zinc-200">
                      <h3 className="font-black text-xl mb-2">🛵 Equipe de Entregadores</h3>
                      <p className="text-xs text-zinc-500 mb-4">Cadastre os motoboys para despachar pedidos e gerenciar o acerto de taxas no caixa.</p>
                      <form onSubmit={handleAddMotoboy} className="flex gap-2 mb-4">
                        <input type="text" value={newMotoboy} onChange={(e) => setNewMotoboy(e.target.value)} placeholder="Nome do Motoboy" className="flex-1 bg-zinc-50 border border-zinc-300 rounded-xl px-4 py-3 text-sm" required />
                        <button type="submit" className="bg-zinc-900 text-white font-black px-4 py-3 rounded-xl text-sm">Adicionar</button>
                      </form>
                      <div className="space-y-2">
                        {motoboys.map(mb => (
                          <div key={mb} className="flex justify-between items-center bg-zinc-50 p-3 rounded-2xl border border-zinc-200 text-sm">
                            <span className="font-bold text-zinc-800">{mb}</span>
                            <button onClick={() => handleDeleteMotoboy(mb)} className="text-red-500 text-base px-2">🗑️</button>
                          </div>
                        ))}
                        {motoboys.length === 0 && <p className="text-xs text-zinc-400 text-center py-2">Nenhum entregador cadastrado.</p>}
                      </div>
                    </div>

                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-zinc-200">
                      <h3 className="font-black text-xl mb-2">➕ Gerenciar Adicionais</h3>
                      <form onSubmit={handleAddAddon} className="space-y-3 mb-4">
                        <input type="text" value={newAddonName} onChange={(e) => setNewAddonName(e.target.value)} placeholder="Nome (Ex: Bacon Extra)" className="w-full bg-zinc-50 border border-zinc-300 rounded-2xl px-4 py-3 text-sm" required />
                        <input type="number" step="0.50" value={newAddonPrice} onChange={(e) => setNewAddonPrice(e.target.value)} placeholder="Preço (Ex: 3.00)" className="w-full bg-zinc-50 border border-zinc-300 rounded-2xl px-4 py-3 text-sm" required />
                        <button type="submit" className="w-full bg-zinc-900 text-white font-black py-3 rounded-2xl text-sm">Adicionar Adicional</button>
                      </form>

                      <div className="space-y-2">
                        {addons.map(addon => (
                          <div key={addon.id} className="flex justify-between items-center bg-zinc-50 p-3 rounded-2xl border border-zinc-200 text-sm">
                            <span className="font-bold text-zinc-800">{addon.name} (+R$ {addon.price.toFixed(2)})</span>
                            <button onClick={() => handleDeleteAddon(addon.id)} className="text-red-500 text-base px-2">🗑️</button>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-zinc-200">
                      <h3 className="font-black text-xl mb-2">📂 Categorias</h3>
                      <div className="space-y-2 mt-2">
                        {categoriesForManagement.map(cat => (
                          <div key={cat} className="flex justify-between items-center bg-zinc-50 p-3 rounded-2xl border border-zinc-200 text-sm">
                            <span className="font-bold text-zinc-800">{cat}</span>
                            <button onClick={() => handleDeleteCategory(cat)} className="text-red-500 text-base px-2">🗑️</button>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </main>

              {isAddProductModalOpen && userRole === 'admin' && (
                <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/60">
                  <div className="bg-white w-full max-w-md rounded-t-[2rem] p-6 relative z-10 h-[85vh] flex flex-col">
                    <div className="flex justify-between items-center mb-6">
                      <h3 className="font-black text-2xl">Novo Produto</h3>
                      <button onClick={() => setIsAddProductModalOpen(false)}>✖️</button>
                    </div>
                    <form className="flex-1 overflow-y-auto space-y-4">
                      <input required type="text" value={newProduct.name} onChange={e => setNewProduct({...newProduct, name: e.target.value})} className="w-full bg-zinc-50 border border-zinc-200 rounded-2xl p-4 text-sm" placeholder="Nome do Produto" />
                      
                      <div className="flex gap-2">
                          <select value={newProduct.category} onChange={e => setNewProduct({...newProduct, category: e.target.value})} className="flex-1 bg-zinc-50 border border-zinc-200 rounded-2xl p-4 text-sm">
                            {customCategories.length === 0 && <option value="">Sem categoria</option>}
                            {categoriesForManagement.map(cat => (<option key={cat} value={cat}>{cat}</option>))}
                          </select>
                          <button type="button" onClick={handleQuickAddCategory} className="bg-amber-500 text-zinc-950 font-black px-4 rounded-2xl text-xs whitespace-nowrap">➕ Nova</button>
                      </div>

                      <input required type="number" step="0.50" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} className="w-full bg-zinc-50 border border-zinc-200 rounded-2xl p-4 text-sm" placeholder="Preço (Ex: 35.00)" />
                      
                      <div className="bg-zinc-50 border border-zinc-200 rounded-2xl p-4 space-y-3">
                        <label className="block text-xs font-bold text-zinc-600 uppercase">Foto do Produto:</label>
                        <div className="flex items-center gap-4">
                          <div className="w-20 h-20 rounded-xl bg-zinc-200 flex items-center justify-center overflow-hidden shrink-0 border border-zinc-300">
                            {newProduct.imageUrl ? (
                              <img src={newProduct.imageUrl} className="w-full h-full object-cover" />
                            ) : (
                              <span className="text-2xl">🍔</span>
                            )}
                          </div>
                          <div className="flex-1">
                            <input 
                              type="file" 
                              accept="image/*" 
                              id="cameraInput" 
                              onChange={handleImageUpload} 
                              className="hidden" 
                            />
                            <label 
                              htmlFor="cameraInput" 
                              className="w-full bg-zinc-900 text-white py-3 px-4 rounded-xl text-xs font-black flex items-center justify-center gap-2 cursor-pointer shadow-sm"
                            >
                              📷 Tirar Foto / Galeria
                            </label>
                            <p className="text-[10px] text-zinc-400 mt-1.5">Escolha da galeria do celular ou abra a câmera para fotografar na hora.</p>
                          </div>
                        </div>
                      </div>

                      <textarea value={newProduct.description} onChange={e => setNewProduct({...newProduct, description: e.target.value})} className="w-full bg-zinc-50 border border-zinc-200 rounded-2xl p-4 h-24 text-sm" placeholder="Descrição / Ingredientes"></textarea>
                    </form>
                    <button onClick={handleAddProduct} className="w-full bg-zinc-900 text-white font-black py-4 rounded-2xl mt-4">Salvar Produto</button>
                  </div>
                </div>
              )}

              <nav className="fixed bottom-0 w-full max-w-md bg-white border-t border-zinc-200 z-30">
                <div className="flex justify-around p-2">
                  <button onClick={() => setPdvTab('orders')} className={`font-bold p-1 text-[11px] ${pdvTab === 'orders' ? 'text-amber-500' : 'text-zinc-400'}`}>Pedidos</button>
                  <button onClick={() => setPdvTab('products')} className={`font-bold p-1 text-[11px] ${pdvTab === 'products' ? 'text-amber-500' : 'text-zinc-400'}`}>Cardápio</button>
                  
                  {userRole === 'admin' && (
                    <>
                      <button onClick={() => setPdvTab('clients')} className={`font-bold p-1 text-[11px] ${pdvTab === 'clients' ? 'text-amber-500' : 'text-zinc-400'}`}>Clientes</button>
                      <button onClick={() => setPdvTab('cash')} className={`font-bold p-1 text-[11px] ${pdvTab === 'cash' ? 'text-amber-500' : 'text-zinc-400'}`}>Caixa</button>
                      <button onClick={() => setPdvTab('reports')} className={`font-bold p-1 text-[11px] ${pdvTab === 'reports' ? 'text-amber-500' : 'text-zinc-400'}`}>Análise</button>
                      <button onClick={() => setPdvTab('config')} className={`font-bold p-1 text-[11px] ${pdvTab === 'config' ? 'text-amber-500' : 'text-zinc-400'}`}>Ajustes</button>
                    </>
                  )}
                </div>
              </nav>
            </div>
          )}
        </div>
      );
    }
    
    // O sistema só monta a tela depois que tiver certeza que conectou
    function App() {
      const [firebaseReady, setFirebaseReady] = useState(!!window.firebaseAPI);
      
      useEffect(() => {
        if (window.firebaseAPI) {
          setFirebaseReady(true);
        } else {
          const handleReady = () => setFirebaseReady(true);
          window.addEventListener('firebase-ready', handleReady);
          return () => window.removeEventListener('firebase-ready', handleReady);
        }
      }, []);

      if (!firebaseReady) return null; 
      return <MainApp />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
