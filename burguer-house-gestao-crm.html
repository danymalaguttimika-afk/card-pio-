 const[api,setApi]=useState(window.crmFirebase||null),[user,setUser]=useState(null),[email,setEmail]=useState(''),[password,setPassword]=useState(''),[loginError,setLoginError]=useState(''),[busy,setBusy]=useState(false);
 const[customers,setCustomers]=useState([]),[orders,setOrders]=useState([]),[coupons,setCoupons]=useState([]),[loading,setLoading]=useState(true),[loadError,setLoadError]=useState('');

 const clients=(()=>{const map=new Map();for(const o of orders){if(o.status==='cancelado'||!o.customerPhone)continue;const phone=normPhone(o.customerPhone);if(!phone)continue;const t=toMillis(o.createdAt);let c=map.get(phone);if(!c){c={phoneNormalized:phone,phone:o.customerPhone,name:o.customerName||'',ordersCount:0,totalSpent:0,firstOrderAt:t,lastOrderAt:t,addresses:[]};map.set(phone,c)}c.ordersCount++;c.totalSpent+=Number(o.total||0);if(t&&(!c.firstOrderAt||t<c.firstOrderAt))c.firstOrderAt=t;if(t>=c.lastOrderAt){c.lastOrderAt=t;c.name=o.customerName||c.name;c.phone=o.customerPhone||c.phone}if(o.customerAddress&&!c.addresses.some(a=>a.value===o.customerAddress))c.addresses.push({value:o.customerAddress,lastUsedAt:t})}

 const historyFor=c=>orders.filter(o=>o.status!=='cancelado'&&normPhone(o.customerPhone)===c.phoneNormalized).sort((a,b)=>toMillis(b.createdAt)-toMillis(a.createdAt));

 const exportCsv=()=>{if(!clients.length)return notify('Ainda não há clientes para exportar.');const rows=clients.map(c=>({nome:c.name||'',telefone:c.phone||c.phoneNormalized||'',aniversario:c.birthday||'',consentimento_aniversario:c.birthdayConsent?'sim':'nao',pedidos:c.ordersCount||0,total_gasto:Number(c.totalSpent||0).toFixed(2),ticket_medio:Number(c.avgTicket||0).toFixed(2),ultimo_pedido:dateTime(c.lastOrderAt),observacoes:c.notes||''}));const cols=Object.keys(rows[0]);const csv=[cols.join(';'),...rows.map(r=>cols.map(k=>`"${String(r[k]).replace(/"/g,'""')}"`).join(';'))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=`clientes-burguer-house-${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
 const syncCustomers=async()=>{if(!confirm('Recalcular os dados agregados dos clientes usando os pedidos existentes? Nomes, aniversários, consentimentos e observações serão preservados.'))return;setSyncing(true);setSyncMsg('');try{const snap=await api.getDocs(api.collection(api.db,'orders'));const map=new Map();snap.forEach(d=>{const o=d.data();if(o.status==='cancelado')return;const phone=normPhone(o.customerPhone);if(!phone)return;const t=toMillis(o.createdAt),n=Number(o.total||0);if(!map.has(phone))map.set(phone,{name:o.customerName||'',phone:o.customerPhone||'',phoneNormalized:phone,addresses:[],totalOrders:0,totalSpent:0,avgTicket:0,firstOrderAt:t?new Date(t):null,lastOrderAt:t?new Date(t):null,source:o.source||'desconhecido',updatedAt:new Date()});const c=map.get(phone);c.totalOrders++;c.totalSpent+=n;if(t){if(!c.firstOrderAt||t<c.firstOrderAt.getTime())c.firstOrderAt=new Date(t);if(!c.lastOrderAt||t>c.lastOrderAt.getTime())c.lastOrderAt=new Date(t)}if(o.customerAddress&&!c.addresses.some(a=>a.value===o.customerAddress))c.addresses.push({label:'Entrega',value:o.customerAddress,lastUsedAt:t?new Date(t):new Date()});if(o.customerName)c.name=o.customerName});const batch=api.writeBatch(api.db);map.forEach((c,p)=>{c.totalSpent=Number(c.totalSpent.toFixed(2));c.avgTicket=c.totalOrders?Number((c.totalSpent/c.totalOrders).toFixed(2)):0;batch.set(api.doc(api.db,'customers',p),c,{merge:true})});await batch.commit();setSyncMsg(`${map.size} clientes recalculados; os dados existentes foram mantidos.`);notify('Sincronização concluída.')}catch(e){console.error(e);setSyncMsg(`Erro: ${e.code||e.message||'falha na sincronização'}`)}finally{setSyncing(false)}};

 const updateCampaign=(id,status)=>{const next=campaignHistory.map(x=>x.id===id?{...x,status,updatedAt:Date.now()}:x);setCampaignHistory(next);localStorage.setItem('burguer_campaign_history',JSON.stringify(next))};

 const createCoupon=async()=>{const val=Number(discountValue),lim=Number(usageLimit);if(!couponCode.trim()||!val||!validUntil)return notify('Preencha código, desconto e validade.');if(val<=0||(discountType==='percent'&&val>100))return notify('Desconto inválido (percentual máximo: 100%).');if(lim<1)return notify('Limite de uso deve ser pelo menos 1.');if(coupons.some(c=>String(c.code||'').toUpperCase()===couponCode.trim().toUpperCase()))return notify('Esse código já existe; gere ou escolha outro.');setBusy(true);try{await api.addDoc(api.collection(api.db,'coupons'),{code:couponCode.trim().toUpperCase(),type:couponType,discountType,discountValue:val,customerPhone:couponClient.phoneNormalized||normPhone(couponClient.phone)||'',customerName:couponClient.name||'',minOrderValue:Number(minOrder)||0,validUntil:new Date(`${validUntil}T23:59:59`),usageLimit:lim,usedCount:0,active:true,createdBy:api.auth.currentUser?.uid||'',createdAt:new Date()});setCouponClient(null);notify('Cupom criado.')}catch(e){console.error(e);notify(`Não foi possível criar o cupom (${e.code||'conexão'}).`)}finally{setBusy(false)}};
 const couponStatus=c=>{const until=c.validUntil?.toDate?c.validUntil.toDate():c.validUntil?new Date(c.validUntil):null;if(c.active===false)return'Desativado';if(until&&until<new Date())return'Expirado';if(Number(c.usedCount||0)>=Number(c.usageLimit||1))return'Esgotado';return'Ativo'};

 {tab==='clients'&&<><div className="flex flex-wrap justify-between items-end gap-3 mb-5"><div><h2 className="text-2xl font-black">Relacionamento com clientes</h2><p className="text-sm text-stone-500">Busca, segmentos, histórico e contato individual</p></div><div className="flex gap-2"><button onClick={syncCustomers} disabled={syncing} className="px-4 py-3 rounded-xl bg-stone-900 text-white font-black text-sm disabled:opacity-50">{syncing?'Sincronizando…':'🔄 Sincronizar pedidos'}</button><button onClick={exportCsv} className="px-4 py-3 rounded-xl bg-white border font-black text-sm">⬇️ Exportar CSV</button></div></div>{syncMsg&&<p className="text-sm text-stone-600 mb-3">{syncMsg}</p>}
 <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">{[['Clientes',clients.length,'bg-white'],['Aniversários no mês',currentBirthdayCount,'bg-pink-50'],['Clientes fiéis',loyalCount,'bg-amber-50'],['Inativos há 30+ dias',churnedCount,'bg-red-50']].map(([l,n,bg])=><div key={l} className={`${bg} border border-stone-200 rounded-2xl p-4`}><div className="text-sm text-stone-500">{l}</div><b className="text-2xl">{n}</b></div>)}</div>
 <section className="bg-white border rounded-2xl shadow-sm overflow-hidden"><div className="p-4 lg:p-5 border-b space-y-4"><div className="flex flex-wrap gap-2">{[['all','Todos'],['loyal','Fiéis 2+'],['churned','Inativos 30+'],['birthday','Aniversários'],['top','Top 10 gastos']].map(([v,l])=><button key={v} onClick={()=>setFilter(v)} className={`px-4 py-2 rounded-xl text-sm font-black ${filter===v?'bg-stone-900 text-white':'bg-stone-100 text-stone-600'}`}>{l}</button>)}</div><div className="flex gap-2"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar nome ou telefone" className="flex-1 border rounded-xl px-4 py-3"/><span className="self-center text-xs text-stone-500">{shownClients.length} resultado(s)</span></div></div><div className="overflow-x-auto crm-scroll"><table className="w-full min-w-[850px] text-sm"><thead className="bg-stone-50 text-stone-500 text-left"><tr><th className="p-4">Cliente</th><th className="p-4">Segmento</th><th className="p-4">Pedidos</th><th className="p-4">Total gasto</th><th className="p-4">Último pedido</th><th className="p-4">Ações</th></tr></thead><tbody>{shownClients.map(c=><tr key={c.phoneNormalized} className="border-t hover:bg-stone-50"><td className="p-4"><b>{c.name||'Cliente sem nome'}</b><div className="text-xs text-stone-500">{c.phone||c.phoneNormalized}</div></td><td className="p-4"><div className="flex flex-wrap gap-1">{tags(c).map(([t,style])=><span key={t} className={`px-2 py-1 rounded-full text-[10px] font-black ${style}`}>{t}</span>)}{c.birthday&&<span className="px-2 py-1 rounded-full text-[10px] font-black bg-pink-50 text-pink-700">🎂 {c.birthday}</span>}</div></td><td className="p-4 font-bold">{c.ordersCount||0}</td><td className="p-4 font-bold">{money(c.totalSpent)}</td><td className="p-4">{c.lastOrderAt?`${dateTime(c.lastOrderAt)}${c.daysAgo===0?' · hoje':` · há ${c.daysAgo}d`}`:'Sem pedidos'}</td><td className="p-4"><div className="flex gap-2"><button onClick={()=>setHistoryClient(c)} className="px-3 py-2 rounded-lg bg-blue-50 text-blue-800 font-bold text-xs">Histórico</button><button onClick={()=>openEdit(c)} className="px-3 py-2 rounded-lg bg-stone-100 font-bold text-xs">Editar</button><button onClick={()=>openCoupon(c)} className="px-3 py-2 rounded-lg bg-purple-900 text-white font-bold text-xs">Cupom</button><button onClick={()=>openCampaign(c)} className="px-3 py-2 rounded-lg bg-green-600 text-white font-bold text-xs">WhatsApp</button></div></td></tr>)}</tbody></table></div>{loading&&<div className="p-8 text-center text-stone-500">Carregando clientes…</div>}{!loading&&!shownClients.length&&<div className="p-10 text-center text-stone-500">Nenhum cliente encontrado neste segmento.</div>}</section>
 <section className="bg-white border rounded-2xl p-5 mt-5"><div className="flex items-center justify-between gap-3"><h3 className="font-black text-lg">📢 Mensagem de campanha</h3><span className="text-xs text-stone-500">{campaignHistory.length} preparadas neste navegador</span></div><p className="text-xs text-stone-500 mt-1 mb-3">[Nome] será substituído. O WhatsApp abre com uma mensagem pronta; confira a permissão de contato e envie manualmente. O histórico fica salvo neste navegador.</p><textarea value={campaignTemplate} onChange={e=>{setCampaignTemplate(e.target.value);localStorage.setItem('burguer_crm_promo_template',e.target.value)}} className="w-full h-24 border rounded-xl p-3"/><div className="mt-4 grid md:grid-cols-2 gap-2">{campaignHistory.slice(0,4).map(x=><div key={x.id} className="border rounded-xl p-3 flex justify-between items-center gap-2"><div><b className="text-sm">{x.customerName}</b><div className="text-xs text-stone-500">{dateTime(x.createdAt)} · {x.status}</div></div><div className="flex gap-1">{x.status==='mensagem preparada'&&<button onClick={()=>updateCampaign(x.id,'enviada')} className="text-xs bg-stone-100 px-2 py-2 rounded-lg">Marcar enviada</button>}{x.status==='enviada'&&<button onClick={()=>updateCampaign(x.id,'venda gerada')} className="text-xs bg-green-100 text-green-800 px-2 py-2 rounded-lg">Venda gerada</button>}</div></div>)}</div></section></>}
 {tab==='coupons'&&<><div className="flex flex-wrap justify-between items-end gap-3 mb-5"><div><h2 className="text-2xl font-black">Cupons personalizados</h2><p className="text-sm text-stone-500">Acompanhe status e desative códigos sem abrir coleção pública</p></div><input value={couponSearch} onChange={e=>setCouponSearch(e.target.value)} placeholder="Buscar código ou cliente" className="border rounded-xl px-4 py-3 w-80"/></div><div className="grid md:grid-cols-2 xl:grid-cols-3 gap-4">{visibleCoupons.map(c=>{const status=couponStatus(c),discount=c.discountType==='percent'?`${c.discountValue}%`:`R$ ${Number(c.discountValue||0).toFixed(2)}`;return <article key={c.id} className="bg-white border rounded-2xl p-5 space-y-3"><div className="flex justify-between gap-2"><div><h3 className="font-black text-lg">{c.code}</h3><p className="text-sm text-stone-500">{c.customerName||'Cliente'} · {discount}</p></div><span className={`h-fit px-3 py-1 rounded-full text-xs font-black ${status==='Ativo'?'bg-green-100 text-green-800':'bg-stone-100 text-stone-500'}`}>{status}</span></div><div className="grid grid-cols-2 gap-2 text-xs"><div className="bg-stone-50 p-3 rounded-xl"><span className="text-stone-500">Uso</span><b className="block">{c.usedCount||0}/{c.usageLimit||1}</b></div><div className="bg-stone-50 p-3 rounded-xl"><span className="text-stone-500">Validade</span><b className="block">{dateTime(c.validUntil)}</b></div></div><div className="text-xs text-stone-500">Tipo: {c.type||'manual'} · Pedido mínimo: {money(c.minOrderValue||0)}</div><div className="flex gap-2">{status==='Ativo'&&<><a href={'https://danymalaguttimika-afk.github.io/card-pio-/burguer-house-cardapio-dados.html?coupon='+encodeURIComponent(c.code)} target="_blank" rel="noreferrer" className="flex-1 text-center bg-amber-400 rounded-xl py-3 font-black text-sm">Abrir cardápio</a>{normPhone(c.customerPhone)&&<a href={couponWhatsapp(c)} target="_blank" rel="noreferrer" className="flex-1 text-center bg-green-600 text-white rounded-xl py-3 font-black text-sm">Preparar WhatsApp</a>}</>}{c.active!==false&&status!=='Expirado'&&<button onClick={()=>deactivateCoupon(c)} className="px-4 rounded-xl bg-red-50 text-red-700 font-bold text-sm">Desativar</button>}</div></article>})}</div>{!visibleCoupons.length&&<div className="bg-white border rounded-2xl p-12 text-center text-stone-500">Nenhum cupom encontrado.</div>}</>}
 </main><footer className="text-center text-xs text-stone-400 p-4">Burguer House · Gestão CRM separada do PDV operacional</footer>
 {editing&&<div className="fixed inset-0 z-40 bg-black/50 grid place-items-center p-4"><div className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4"><div className="flex justify-between"><div><h3 className="text-xl font-black">Editar cadastro CRM</h3><p className="text-sm text-stone-500">{editing.phone||editing.phoneNormalized}</p></div><button onClick={()=>setEditing(null)} className="text-2xl">×</button></div><label className="block text-sm font-bold">Nome<input value={nameInput} onChange={e=>setNameInput(e.target.value)} className="block w-full mt-1 border rounded-xl px-3 py-3"/></label><div><label className="block text-sm font-bold">Aniversário</label><div className="grid grid-cols-2 gap-2 mt-1"><select value={birthday.slice(0,2)} onChange={e=>setBirthday(e.target.value?`${e.target.value}-${birthday.slice(3,5)}`:'')} className="border rounded-xl px-3 py-3"><option value="">Mês</option>{Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).map(m=><option key={m} value={m}>{m}</option>)}</select><select value={birthday.slice(3,5)} onChange={e=>setBirthday(e.target.value?`${birthday.slice(0,2)}-${e.target.value}`:'')} className="border rounded-xl px-3 py-3"><option value="">Dia</option>{Array.from({length:31},(_,i)=>String(i+1).padStart(2,'0')).map(d=><option key={d} value={d}>{d}</option>)}</select></div><p className="text-xs text-stone-500 mt-1">Mês e dia; a data é salva como MM-DD.</p></div><label className="flex gap-2 items-center text-sm"><input type="checkbox" checked={birthdayConsent} onChange={e=>setBirthdayConsent(e.target.checked)}/> Cliente autorizou receber campanha de aniversário</label><label className="block text-sm font-bold">Observações internas<textarea value={notes} onChange={e=>setNotes(e.target.value)} className="block w-full mt-1 border rounded-xl p-3 h-24"/></label><button disabled={busy} onClick={saveClient} className="w-full bg-amber-400 py-3 rounded-xl font-black">Salvar cadastro</button></div></div>}
 {historyClient&&<div className="fixed inset-0 z-40 bg-black/50 grid place-items-center p-4"><div className="bg-white rounded-2xl p-6 max-w-2xl w-full max-h-[90vh] overflow-auto shadow-2xl"><div className="flex justify-between"><div><h3 className="text-2xl font-black">Histórico do cliente</h3><p className="text-stone-500">{historyClient.name||'Cliente'} · {historyClient.phone||historyClient.phoneNormalized}</p></div><button onClick={()=>setHistoryClient(null)} className="text-2xl">×</button></div><div className="grid grid-cols-3 gap-2 my-4"><div className="bg-stone-100 p-3 rounded-xl"><small>Pedidos</small><b className="block text-lg">{historyClient.ordersCount||0}</b></div><div className="bg-stone-100 p-3 rounded-xl"><small>Total gasto</small><b className="block">{money(historyClient.totalSpent)}</b></div><div className="bg-stone-100 p-3 rounded-xl"><small>Ticket médio</small><b className="block">{money(historyClient.avgTicket)}</b></div></div>{historyClient.addresses?.length>0&&<div className="bg-stone-50 p-3 rounded-xl mb-3 text-sm"><b>Endereço recente</b><p>{historyClient.addresses[historyClient.addresses.length-1].value}</p></div>}<div className="grid md:grid-cols-2 gap-2 mb-4">{[['🍔 Mais pedidos',prefsFor(historyClient).products],['➕ Extras favoritos',prefsFor(historyClient).addons]].map(([t,list])=><div key={t} className="bg-amber-50 rounded-xl p-3"><b>{t}</b>{list.length?list.map(([n,q])=><p key={n} className="text-sm">{q}× {n}</p>):<p className="text-xs text-stone-500">Sem dados</p>}</div>)}</div><h4 className="font-black mb-2">Pedidos anteriores</h4>{historyFor(historyClient).map(o=><div key={o.id} className="border rounded-xl p-3 mb-2"><div className="flex justify-between text-sm"><b>#{o.id.slice(0,5).toUpperCase()} · {o.status||'pendente'}</b><b>{money(o.total)}</b></div><p className="text-xs text-stone-500">{dateTime(o.createdAt)} · {o.paymentMethod||'—'} · {o.customerAddress||''}</p><div className="mt-2 text-sm">{(o.items||[]).map((i,n)=><div key={n}>{i.quantity}× {i.name}{i.isGift?' · brinde':''}{i.addons?.length?` + ${i.addons.map(a=>a.name).join(', ')}`:''}</div>)}</div>{o.discountAmount>0&&<p className="text-xs text-green-700">Cupom {o.couponCode}: −{money(o.discountAmount)}</p>}</div>)}{historyFor(historyClient).length===0&&<p className="text-center p-6 text-stone-500">Nenhum pedido.</p>}</div></div>}
 {couponClient&&<div className="fixed inset-0 z-50 bg-black/50 grid place-items-center p-4"><div className="bg-white rounded-2xl p-6 max-w-lg w-full max-h-[92vh] overflow-auto shadow-2xl space-y-4"><div className="flex justify-between"><div><h3 className="text-xl font-black">Criar cupom personalizado</h3><p className="text-sm text-stone-500">{couponClient.name} · {couponClient.phone||couponClient.phoneNormalized}</p></div><button onClick={()=>setCouponClient(null)} className="text-2xl">×</button></div><label className="block text-sm font-bold">Código<input value={couponCode} onChange={e=>setCouponCode(e.target.value.toUpperCase().replace(/[^A-Z0-9_-]/g,''))} className="block w-full mt-1 border rounded-xl px-3 py-3 font-black"/></label><div className="grid grid-cols-2 gap-2"><select value={couponType} onChange={e=>{setCouponType(e.target.value);setCouponCode(couponCodeFor(e.target.value,couponClient))}} className="border rounded-xl px-3 py-3"><option value="birthday">Aniversário</option><option value="winback">Cliente sumido</option><option value="loyal">Cliente fiel</option><option value="manual">Manual</option></select><select value={discountType} onChange={e=>setDiscountType(e.target.value)} className="border rounded-xl px-3 py-3"><option value="percent">Percentual (%)</option><option value="fixed">Valor fixo (R$)</option></select></div><div className="grid grid-cols-2 gap-2"><input type="number" min="0.01" step="0.01" value={discountValue} onChange={e=>setDiscountValue(e.target.value)} placeholder="Desconto" className="border rounded-xl px-3 py-3"/><input type="number" min="0" step="0.01" value={minOrder} onChange={e=>setMinOrder(e.target.value)} placeholder="Pedido mínimo" className="border rounded-xl px-3 py-3"/></div><div className="grid grid-cols-2 gap-2"><label className="text-xs font-bold">Validade<input type="date" value={validUntil} onChange={e=>setValidUntil(e.target.value)} className="block w-full border rounded-xl px-3 py-3 mt-1"/></label><label className="text-xs font-bold">Limite de usos<input type="number" min="1" value={usageLimit} onChange={e=>setUsageLimit(e.target.value)} className="block w-full border rounded-xl px-3 py-3 mt-1"/></label></div><button disabled={busy} onClick={createCoupon} className="w-full bg-purple-900 text-white py-3 rounded-xl font-black">Salvar cupom</button><p className="text-xs text-stone-500">A validação e o resgate continuam no backend já existente; este painel não expõe a coleção de cupons ao cardápio público.</p></div></div>}
 {toast&&<div className="fixed bottom-5 right-5 z-[60] bg-stone-900 text-white px-5 py-4 rounded-xl shadow-xl">{toast}</div>}
 </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
