 {storeSection==='banners'&&<div className="grid xl:grid-cols-[minmax(0,1fr)_minmax(0,1.2fr)] gap-5"><form onSubmit={saveBanner} className="bg-white border rounded-2xl p-5 space-y-4"><div><h3 className="font-black text-xl">{bannerEditId?'Editar banner':'Novo banner'}</h3><p className="text-sm text-stone-500">Até 4 banners. Máximo de 200 KB por imagem; o tamanho final do documento também é verificado antes de salvar.</p></div><label className="block text-sm font-bold">Título<input value={bannerTitle} onChange={e=>setBannerTitle(e.target.value)} maxLength={80} className="block w-full mt-1 border rounded-xl px-3 py-3" placeholder="Ex.: Bem-vindo à Burguer House" required/></label><label className="block text-sm font-bold">Subtítulo opcional<input value={bannerSubtitle} onChange={e=>setBannerSubtitle(e.target.value)} maxLength={120} className="block w-full mt-1 border rounded-xl px-3 py-3" placeholder="Mensagem curta"/></label><label className="block text-sm font-bold">Tipo<select value={bannerType} onChange={e=>setBannerType(e.target.value)} className="block w-full mt-1 border rounded-xl px-3 py-3"><option value="welcome">Boas-vindas</option><option value="product">Produto</option><option value="promotion">Promoção aprovada</option></select></label><label className="block text-sm font-bold">Imagem {bannerEditId?'(opcional para manter a atual)':''}<input type="file" accept="image/*" onChange={handleBannerImage} className="block w-full mt-1 border rounded-xl px-3 py-3" required={!bannerEditId}/><span className="text-xs font-normal text-stone-500">Redimensionada para no máximo 900×450 px.</span></label>{(bannerImage||((storeConfig.banners||[]).find(b=>b.id===bannerEditId)?.imageUrl))&&<img src={bannerImage||((storeConfig.banners||[]).find(b=>b.id===bannerEditId)?.imageUrl)} alt="Prévia do banner" className="w-full max-h-44 object-cover rounded-xl"/>}<div className="grid grid-cols-2 gap-3"><label className="block text-sm font-bold">Exibir a partir de<input type="date" value={bannerStart} onChange={e=>setBannerStart(e.target.value)} className="block w-full mt-1 border rounded-xl px-3 py-3"/></label><label className="block text-sm font-bold">Exibir até<input type="date" value={bannerEnd} onChange={e=>setBannerEnd(e.target.value)} className="block w-full mt-1 border rounded-xl px-3 py-3"/></label></div><p className="text-xs text-stone-500">Deixe as datas vazias para não limitar o período. O cardápio só mostra banners ativos e válidos. Não inclua desconto ou oferta sem aprovação.</p><div className="flex gap-2">{bannerEditId&&<button type="button" onClick={resetBannerForm} className="flex-1 border rounded-xl py-3 font-bold">Cancelar edição</button>}<button disabled={busy} className="flex-1 bg-amber-400 rounded-xl py-3 font-black">{busy?'Salvando…':bannerEditId?'Atualizar banner':'Salvar banner'}</button></div></form><section className="bg-white border rounded-2xl p-5"><div className="flex justify-between items-center gap-3"><div><h3 className="font-black text-xl">Banners cadastrados</h3><p className="text-xs text-stone-500">Use ↑/↓ para ordenar; ativar e desativar controla a vitrine.</p></div><span className="px-3 py-1 rounded-full bg-amber-100 text-amber-900 text-xs font-black">{(storeConfig.banners||[]).length}/4</span></div><div className="space-y-3 mt-4">{[...(storeConfig.banners||[])].sort((a,b)=>Number(a.order||0)-Number(b.order||0)).map((b,i)=><article key={b.id} className="border rounded-2xl p-3 flex gap-3 items-start"><img src={b.imageUrl} alt="" className="w-24 h-20 rounded-xl object-cover shrink-0 bg-stone-100"/><div className="min-w-0 flex-1"><div className="flex items-start justify-between gap-2"><div><b className="block truncate">{b.title||'Banner sem título'}</b><span className="text-xs text-stone-500">{b.type||'welcome'} · {b.startAt?dateTime(b.startAt):'sem início'} → {b.endAt?dateTime(b.endAt):'sem fim'}</span></div><span className={`shrink-0 px-2 py-1 rounded-full text-[10px] font-black ${b.active===false?'bg-stone-100 text-stone-500':'bg-green-100 text-green-800'}`}>{b.active===false?'Pausado':'Ativo'}</span></div>{b.subtitle&&<p className="text-xs text-stone-500 mt-1 line-clamp-2">{b.subtitle}</p>}<div className="flex flex-wrap gap-2 mt-3"><button onClick={()=>moveBanner(b,-1)} disabled={i===0} className="px-3 py-2 border rounded-lg text-xs font-bold disabled:opacity-40" title="Mover para cima">↑</button><button onClick={()=>moveBanner(b,1)} disabled={i===(storeConfig.banners||[]).length-1} className="px-3 py-2 border rounded-lg text-xs font-bold disabled:opacity-40" title="Mover para baixo">↓</button><button onClick={()=>editBanner(b)} className="px-3 py-2 bg-blue-50 text-blue-800 rounded-lg text-xs font-bold">Editar</button><button onClick={()=>toggleBanner(b)} className="px-3 py-2 bg-amber-50 text-amber-900 rounded-lg text-xs font-bold">{b.active===false?'Ativar':'Pausar'}</button><button onClick={()=>removeBanner(b)} className="px-3 py-2 bg-red-50 text-red-700 rounded-lg text-xs font-bold">Excluir</button></div></div></article>)}</div>{!(storeConfig.banners||[]).length&&<p className="text-center text-sm text-stone-500 py-12">Nenhum banner cadastrado. Comece, se quiser, por uma mensagem neutra de boas-vindas.</p>}</section></div>}
 {storeSection==='products'&&<section className="bg-white border rounded-2xl overflow-hidden"><div className="p-4 flex flex-wrap justify-between items-center gap-3 border-b"><div><h3 className="font-black text-xl">Produtos do cardápio</h3><p className="text-xs text-stone-500">Cadastro e preço; pausar/reativar produto fica no PDV.</p></div><div className="flex gap-2"><input value={productSearch} onChange={e=>setProductSearch(e.target.value)} placeholder="Buscar produto" className="border rounded-xl px-3 py-2"/><button onClick={()=>startProduct()} className="bg-amber-400 px-4 py-3 rounded-xl font-black">＋ Novo produto</button></div></div><div className="overflow-x-auto crm-scroll"><table className="w-full min-w-[760px] text-sm"><thead className="bg-stone-50 text-stone-500 text-left"><tr><th className="p-4">Produto</th><th className="p-4">Categoria</th><th className="p-4">Preço</th><th className="p-4">Status atual</th><th className="p-4">Ações</th></tr></thead><tbody>{visibleProducts.map(p=><tr key={p.id} className="border-t"><td className="p-4"><b>{p.name}</b>{p.description&&<div className="text-xs text-stone-500 max-w-sm truncate">{p.description}</div>}</td><td className="p-4">{p.category||'Sem categoria'}</td><td className="p-4 font-bold">{money(p.price)}<div className="text-[10px] text-stone-400">Custo: {money(p.costPrice)}</div></td><td className="p-4"><span className={`px-3 py-1 rounded-full text-xs font-black ${p.paused?'bg-stone-100 text-stone-500':'bg-green-100 text-green-700'}`}>{p.paused?'Pausado':'Ativo'}</span></td><td className="p-4"><div className="flex gap-2"><button onClick={()=>startProduct(p)} className="px-3 py-2 bg-blue-50 text-blue-800 rounded-lg text-xs font-bold">Editar</button><button onClick={()=>removeProduct(p)} className="px-3 py-2 bg-red-50 text-red-700 rounded-lg text-xs font-bold">Excluir</button></div></td></tr>)}</tbody></table></div>{!visibleProducts.length&&<p className="p-8 text-center text-stone-500">Nenhum produto encontrado.</p>}</section>}
 {storeSection==='categories'&&<div className="grid lg:grid-cols-2 gap-5"><form onSubmit={saveCategory} className="bg-white border rounded-2xl p-5 space-y-4"><h3 className="font-black text-xl">📂 Nova categoria</h3><input value={newCategoryName} onChange={e=>setNewCategoryName(e.target.value)} placeholder="Nome da categoria" className="w-full border rounded-xl px-3 py-3" required/><label className="flex gap-2 items-center text-sm"><input type="checkbox" checked={newCategoryHasAddons} onChange={e=>setNewCategoryHasAddons(e.target.checked)}/> Exibir adicionais para produtos desta categoria</label><button className="bg-stone-900 text-white px-5 py-3 rounded-xl font-black">Criar categoria</button></form><section className="bg-white border rounded-2xl p-5"><h3 className="font-black text-xl mb-3">Categorias existentes</h3><div className="space-y-2">{allStoreCategories.map(cat=><div key={cat} className="flex flex-wrap items-center justify-between gap-3 border rounded-xl p-3"><div><b>{cat}</b><p className="text-xs text-stone-500">{products.filter(p=>p.category===cat).length} produto(s)</p></div><label className="flex items-center gap-2 text-xs"><input type="checkbox" checked={storeCategories.addonCategories?.[cat]!==false} onChange={e=>setCategoryAddons(cat,e.target.checked)}/> Permite adicionais</label><button onClick={()=>removeCategory(cat)} className="px-3 py-2 text-xs rounded-lg bg-red-50 text-red-700 font-bold">Excluir</button></div>)}</div></section></div>}
 {storeSection==='addons'&&<div className="grid lg:grid-cols-2 gap-5"><form onSubmit={addAddon} className="bg-white border rounded-2xl p-5 space-y-3"><h3 className="font-black text-xl">➕ Cadastrar adicional</h3><input value={newAddonName} onChange={e=>setNewAddonName(e.target.value)} placeholder="Nome (ex.: bacon extra)" className="w-full border rounded-xl px-3 py-3" required/><input type="number" min="0" step="0.50" value={newAddonPrice} onChange={e=>setNewAddonPrice(e.target.value)} placeholder="Preço (R$)" className="w-full border rounded-xl px-3 py-3" required/><button className="bg-stone-900 text-white px-5 py-3 rounded-xl font-black">Adicionar</button></form><section className="bg-white border rounded-2xl p-5"><h3 className="font-black text-xl mb-3">Adicionais cadastrados</h3><div className="space-y-2">{addons.map(a=><div key={a.id} className="flex justify-between items-center border rounded-xl p-3"><div><b>{a.name}</b><div className="text-xs text-stone-500">{money(a.price)}</div></div><button onClick={()=>removeAddon(a)} className="px-3 py-2 rounded-lg bg-red-50 text-red-700 text-xs font-bold">Excluir</button></div>)}</div>{!addons.length&&<p className="text-sm text-stone-500">Nenhum adicional cadastrado.</p>}</section></div>}
 {storeSection==='motoboys'&&<div className="grid lg:grid-cols-2 gap-5"><form onSubmit={addMotoboy} className="bg-white border rounded-2xl p-5 space-y-3"><h3 className="font-black text-xl">🛵 Cadastrar entregador</h3><p className="text-sm text-stone-500">A lista aparece no fluxo de despacho do PDV.</p><input value={newMotoboy} onChange={e=>setNewMotoboy(e.target.value)} placeholder="Nome do entregador" className="w-full border rounded-xl px-3 py-3" required/><button className="bg-stone-900 text-white px-5 py-3 rounded-xl font-black">Adicionar entregador</button></form><section className="bg-white border rounded-2xl p-5"><h3 className="font-black text-xl mb-3">Equipe de entrega</h3><div className="space-y-2">{motoboys.map(m=><div key={m} className="flex justify-between items-center border rounded-xl p-3"><b>{m}</b><button onClick={()=>removeMotoboy(m)} className="px-3 py-2 rounded-lg bg-red-50 text-red-700 text-xs font-bold">Remover</button></div>)}</div>{!motoboys.length&&<p className="text-sm text-stone-500">Nenhum entregador cadastrado.</p>}</section></div>}
 </section>}
 </main><footer className="text-center text-xs text-stone-400 p-4">Burguer House · Gestão e CRM separados do PDV operacional</footer>
 {productEditor!==null&&<div className="fixed inset-0 z-40 bg-black/50 grid place-items-center p-4"><form onSubmit={saveProduct} className="bg-white rounded-2xl p-6 max-w-xl w-full max-h-[92vh] overflow-auto shadow-2xl space-y-4"><div className="flex justify-between"><div><h3 className="text-xl font-black">{productEditor.id?'Editar produto':'Novo produto'}</h3><p className="text-sm text-stone-500">As mudanças de preço e cadastro refletem no cardápio.</p></div><button type="button" onClick={()=>setProductEditor(null)} className="text-2xl">×</button></div><label className="block text-sm font-bold">Nome<input value={productDraft.name} onChange={e=>setProductDraft(x=>({...x,name:e.target.value}))} className="block w-full mt-1 border rounded-xl px-3 py-3" required/></label><div className="grid grid-cols-2 gap-3"><label className="block text-sm font-bold">Preço de venda (R$)<input type="number" min="0.01" step="0.01" value={productDraft.price} onChange={e=>setProductDraft(x=>({...x,price:e.target.value}))} className="block w-full mt-1 border rounded-xl px-3 py-3" required/></label><label className="block text-sm font-bold">Custo interno (opcional)<input type="number" min="0" step="0.01" value={productDraft.costPrice} onChange={e=>setProductDraft(x=>({...x,costPrice:e.target.value}))} className="block w-full mt-1 border rounded-xl px-3 py-3"/></label></div><label className="block text-sm font-bold">Categoria<select value={productDraft.category} onChange={e=>setProductDraft(x=>({...x,category:e.target.value}))} className="block w-full mt-1 border rounded-xl px-3 py-3"><option value="">Sem categoria</option>{allStoreCategories.map(c=><option key={c} value={c}>{c}</option>)}</select></label><label className="block text-sm font-bold">Descrição<textarea value={productDraft.description} onChange={e=>setProductDraft(x=>({...x,description:e.target.value}))} className="block w-full mt-1 border rounded-xl px-3 py-3 h-20"/></label><label className="block text-sm font-bold">URL da foto (opcional)<input type="text" value={productDraft.imageUrl.startsWith('data:')?'':productDraft.imageUrl} onChange={e=>setProductDraft(x=>({...x,imageUrl:e.target.value}))} className="block w-full mt-1 border rounded-xl px-3 py-3" placeholder="https://…"/></label><label className="block text-sm font-bold">Ou enviar imagem do computador<input type="file" accept="image/*" onChange={handleProductImageFile} className="block w-full mt-1 border rounded-xl px-3 py-3"/><span className="text-xs font-normal text-stone-500">A imagem será reduzida antes de salvar.</span></label>{productDraft.imageUrl&&<img src={productDraft.imageUrl} className="w-24 h-24 object-cover rounded-xl"/>}<div className="flex gap-2"><button type="button" onClick={()=>setProductEditor(null)} className="flex-1 border rounded-xl py-3 font-bold">Cancelar</button><button disabled={busy} className="flex-1 bg-amber-400 rounded-xl py-3 font-black">{busy?'Salvando…':'Salvar produto'}</button></div></form></div>}
 {editing&&<div className="fixed inset-0 z-40 bg-black/50 grid place-items-center p-4"><div className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4"><div className="flex justify-between"><div><h3 className="text-xl font-black">Editar cadastro CRM</h3><p className="text-sm text-stone-500">{editing.phone||editing.phoneNormalized}</p></div><button onClick={()=>setEditing(null)} className="text-2xl">×</button></div><label className="block text-sm font-bold">Nome<input value={nameInput} onChange={e=>setNameInput(e.target.value)} className="block w-full mt-1 border rounded-xl px-3 py-3"/></label><div><label className="block text-sm font-bold">Aniversário</label><div className="grid grid-cols-2 gap-2 mt-1"><select value={birthday.slice(0,2)} onChange={e=>setBirthday(e.target.value?`${e.target.value}-${birthday.slice(3,5)}`:'')} className="border rounded-xl px-3 py-3"><option value="">Mês</option>{Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).map(m=><option key={m} value={m}>{m}</option>)}</select><select value={birthday.slice(3,5)} onChange={e=>setBirthday(e.target.value?`${birthday.slice(0,2)}-${e.target.value}`:'')} className="border rounded-xl px-3 py-3"><option value="">Dia</option>{Array.from({length:31},(_,i)=>String(i+1).padStart(2,'0')).map(d=><option key={d} value={d}>{d}</option>)}</select></div><p className="text-xs text-stone-500 mt-1">Mês e dia; a data é salva como MM-DD.</p></div><label className="flex gap-2 items-center text-sm"><input type="checkbox" checked={birthdayConsent} onChange={e=>setBirthdayConsent(e.target.checked)}/> Cliente autorizou receber campanha de aniversário</label><label className="block text-sm font-bold">Observações internas<textarea value={notes} onChange={e=>setNotes(e.target.value)} className="block w-full mt-1 border rounded-xl p-3 h-24"/></label><button disabled={busy} onClick={saveClient} className="w-full bg-amber-400 py-3 rounded-xl font-black">Salvar cadastro</button></div></div>}
 {historyClient&&<div className="fixed inset-0 z-40 bg-black/50 grid place-items-center p-4"><div className="bg-white rounded-2xl p-6 max-w-2xl w-full max-h-[90vh] overflow-auto shadow-2xl"><div className="flex justify-between"><div><h3 className="text-2xl font-black">Histórico do cliente</h3><p className="text-stone-500">{historyClient.name||'Cliente'} · {historyClient.phone||historyClient.phoneNormalized}</p></div><button onClick={()=>setHistoryClient(null)} className="text-2xl">×</button></div><div className="grid grid-cols-3 gap-2 my-4"><div className="bg-stone-100 p-3 rounded-xl"><small>Pedidos</small><b className="block text-lg">{historyClient.ordersCount||0}</b></div><div className="bg-stone-100 p-3 rounded-xl"><small>Total gasto</small><b className="block">{money(historyClient.totalSpent)}</b></div><div className="bg-stone-100 p-3 rounded-xl"><small>Ticket médio</small><b className="block">{money(historyClient.avgTicket)}</b></div></div>{historyClient.addresses?.length>0&&<div className="bg-stone-50 p-3 rounded-xl mb-3 text-sm"><b>Endereço recente</b><p>{historyClient.addresses[historyClient.addresses.length-1].value}</p></div>}<div className="grid md:grid-cols-2 gap-2 mb-4">{[['🍔 Mais pedidos',prefsFor(historyClient).products],['➕ Extras favoritos',prefsFor(historyClient).addons]].map(([t,list])=><div key={t} className="bg-amber-50 rounded-xl p-3"><b>{t}</b>{list.length?list.map(([n,q])=><p key={n} className="text-sm">{q}× {n}</p>):<p className="text-xs text-stone-500">Sem dados</p>}</div>)}</div><h4 className="font-black mb-2">Pedidos anteriores</h4>{historyFor(historyClient).map(o=><div key={o.id} className="border rounded-xl p-3 mb-2"><div className="flex justify-between text-sm"><b>#{o.id.slice(0,5).toUpperCase()} · {o.status||'pendente'}</b><b>{money(o.total)}</b></div><p className="text-xs text-stone-500">{dateTime(o.createdAt)} · {o.paymentMethod||'—'} · {o.customerAddress||''}</p><div className="mt-2 text-sm">{(o.items||[]).map((i,n)=><div key={n}>{i.quantity}× {i.name}{i.isGift?' · brinde':''}{i.addons?.length?` + ${i.addons.map(a=>a.name).join(', ')}`:''}</div>)}</div>{o.discountAmount>0&&<p className="text-xs text-green-700">Cupom {o.couponCode}: −{money(o.discountAmount)}</p>}</div>)}{historyFor(historyClient).length===0&&<p className="text-center p-6 text-stone-500">Nenhum pedido.</p>}</div></div>}
 {couponClient&&<div className="fixed inset-0 z-50 bg-black/50 grid place-items-center p-4"><div className="bg-white rounded-2xl p-6 max-w-lg w-full max-h-[92vh] overflow-auto shadow-2xl space-y-4"><div className="flex justify-between"><div><h3 className="text-xl font-black">Criar cupom personalizado</h3><p className="text-sm text-stone-500">{couponClient.name} · {couponClient.phone||couponClient.phoneNormalized}</p></div><button onClick={()=>setCouponClient(null)} className="text-2xl">×</button></div><label className="block text-sm font-bold">Código<input value={couponCode} onChange={e=>setCouponCode(e.target.value.toUpperCase().replace(/[^A-Z0-9_-]/g,''))} className="block w-full mt-1 border rounded-xl px-3 py-3 font-black"/></label><div className="grid grid-cols-2 gap-2"><select value={couponType} onChange={e=>{setCouponType(e.target.value);setCouponCode(couponCodeFor(e.target.value,couponClient))}} className="border rounded-xl px-3 py-3"><option value="birthday">Aniversário</option><option value="winback">Cliente sumido</option><option value="loyal">Cliente fiel</option><option value="manual">Manual</option></select><select value={discountType} onChange={e=>setDiscountType(e.target.value)} className="border rounded-xl px-3 py-3"><option value="percent">Percentual (%)</option><option value="fixed">Valor fixo (R$)</option></select></div><div className="grid grid-cols-2 gap-2"><input type="number" min="0.01" step="0.01" value={discountValue} onChange={e=>setDiscountValue(e.target.value)} placeholder="Desconto" className="border rounded-xl px-3 py-3"/><input type="number" min="0" step="0.01" value={minOrder} onChange={e=>setMinOrder(e.target.value)} placeholder="Pedido mínimo" className="border rounded-xl px-3 py-3"/></div><div className="grid grid-cols-2 gap-2"><label className="text-xs font-bold">Validade<input type="date" value={validUntil} onChange={e=>setValidUntil(e.target.value)} className="block w-full border rounded-xl px-3 py-3 mt-1"/></label><label className="text-xs font-bold">Limite de usos<input type="number" min="1" value={usageLimit} onChange={e=>setUsageLimit(e.target.value)} className="block w-full border rounded-xl px-3 py-3 mt-1"/></label></div><button disabled={busy} onClick={createCoupon} className="w-full bg-purple-900 text-white py-3 rounded-xl font-black">Salvar cupom</button><p className="text-xs text-stone-500">A validação e o resgate continuam no backend já existente; este painel não expõe a coleção de cupons ao cardápio público.</p></div></div>}
 {toast&&<div className="fixed bottom-5 right-5 z-[60] bg-stone-900 text-white px-5 py-4 rounded-xl shadow-xl">{toast}</div>}
 </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
