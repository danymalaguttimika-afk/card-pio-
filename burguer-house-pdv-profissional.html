  <header className="topbar px-6 py-4 flex items-center justify-between shadow-lg"><div className="flex items-center gap-4"><div className="bg-amber-400 text-stone-900 font-black rounded-xl w-12 h-12 grid place-items-center text-2xl">BH</div><div><h1 className="font-black text-xl tracking-wide">BURGUER HOUSE <span className="text-amber-300">· PDV</span></h1><p className="text-xs text-stone-300">Operação de balcão e delivery</p></div></div><div className="flex items-center gap-4"><span className="text-sm hidden md:block">{user.email}</span><button title="Clique para abrir/fechar a loja" onClick={toggleStoreQuick} className={`px-3 py-2 rounded-full text-xs font-black ${config.storeOpen===false?'bg-red-200 text-red-800':'bg-green-200 text-green-800'}`}>{config.storeOpen===false?'LOJA FECHADA · ABRIR':'LOJA ABERTA · FECHAR'}</button><button onClick={()=>api.signOut(api.auth)} className="bg-white/10 hover:bg-white/20 px-3 py-2 rounded-xl text-xs font-bold">Sair</button></div></header>
  <nav className="px-5 md:px-6 py-3 grid grid-cols-2 md:grid-cols-4 gap-3 bg-[#181513] border-b border-[#433632] shadow-lg"><button onClick={()=>setTab('sale')} className="col-span-2 md:row-span-2 min-h-[106px] md:min-h-[178px] rounded-2xl bg-gradient-to-br from-red-700 to-red-950 text-white text-left p-5 md:p-6 flex flex-col justify-between shadow-xl hover:brightness-110"><span className="text-4xl">＋</span><span><b className="block text-xl md:text-2xl">Novo pedido</b><small className="text-white/75">Venda rápida · iniciar atendimento</small></span></button><button onClick={()=>setTab('orders')} className="col-span-2 min-h-[70px] md:min-h-[82px] rounded-2xl bg-amber-400 text-[#211a14] text-left px-5 py-3 flex items-center justify-between shadow-lg hover:brightness-105"><span><b className="block text-lg">📋 Fila de pedidos</b><small>{activeOrders.length} em andamento</small></span><span className="text-2xl font-black">›</span></button><button onClick={()=>setTab('cash')} className="min-h-[70px] md:min-h-[82px] rounded-2xl bg-[#292322] border border-[#51413b] text-white text-left px-4 py-3 flex items-center gap-3 hover:border-amber-400"><span className="text-2xl">💵</span><span><b className="block">Caixa</b><small className="text-stone-300">{currentCash?'Sessão aberta':'Fechado'}</small></span></button><button onClick={()=>{setTab('sale');setShowAvailability(true)}} className="min-h-[70px] md:min-h-[82px] rounded-2xl bg-[#292322] border border-[#51413b] text-white text-left px-4 py-3 flex items-center gap-3 hover:border-amber-400"><span className="text-2xl">🍔</span><span><b className="block">Disponibilidade</b><small className="text-stone-300">Pausar ou reativar</small></span></button></nav>
  <main className="flex-1 p-5 lg:p-6 max-w-[1800px] w-full mx-auto">
  {tab==='sale'&&<div className="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_440px] gap-5 min-h-[calc(100vh-150px)]"><section className="bg-white rounded-2xl shadow-sm border p-5 flex flex-col min-h-[600px]"><div className="flex items-center justify-between gap-4 mb-4"><div><h2 className="text-2xl font-black">Produtos</h2><p className="text-sm text-stone-500">Clique para adicionar ao pedido</p></div><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar produto…" className="border rounded-xl px-4 py-3 w-72"/><button onClick={()=>setShowAvailability(x=>!x)} className="px-4 py-3 rounded-xl bg-stone-100 font-bold text-sm">⚙️ Disponibilidade</button></div>{showAvailability&&<div className="mb-4 border rounded-xl p-3 bg-stone-50 max-h-48 overflow-y-auto"><p className="text-xs text-stone-500 mb-2">Pausar ou reativar produtos no cardápio:</p>{products.map(p=><div key={p.id} className="flex justify-between items-center py-2 border-t text-sm"><span className={p.paused?'text-stone-400 line-through':'font-bold'}>{p.name} · {money(p.price)}</span><button onClick={()=>toggleProductQuick(p)} className={`px-3 py-1 rounded-lg text-xs font-black ${p.paused?'bg-green-100 text-green-800':'bg-amber-100 text-amber-800'}`}>{p.paused?'Reativar':'Pausar'}</button></div>)}</div>}<div className="flex gap-2 overflow-x-auto scrollbar-hide pb-4">{catList.map(c=><button key={c} onClick={()=>setCategory(c)} className={`px-4 py-2 rounded-full whitespace-nowrap font-bold text-sm ${category===c?'bg-stone-900 text-white':'bg-stone-100 text-stone-600'}`}>{c}</button>)}</div><div className="grid grid-cols-2 md:grid-cols-3 2xl:grid-cols-4 gap-3 overflow-y-auto pr-1">{visibleProducts.map(p=><button key={p.id} onClick={()=>{setSelectedProduct(p);setSelectedAddons({});setItemNote('')}} className="text-left rounded-2xl border hover:border-amber-400 hover:shadow-md overflow-hidden bg-white"><div className="h-32 bg-stone-100 grid place-items-center">{p.imageUrl?<img src={p.imageUrl} className="w-full h-full object-cover"/>:<span className="text-4xl">🍔</span>}</div><div className="p-3"><div className="font-black leading-tight">{p.name}</div><div className="text-xs text-stone-500 mt-1">{p.category||'Geral'}</div><div className="text-lg font-black text-red-800 mt-2">{money(p.price)}</div></div></button>)}</div>{visibleProducts.length===0&&<p className="text-center text-stone-400 py-10">Nenhum produto disponível.</p>}</section>
   <aside className="bg-white rounded-2xl shadow-sm border p-5 flex flex-col gap-4"><div className="flex items-center justify-between"><div><h2 className="text-2xl font-black">Pedido atual</h2><p className="text-xs text-stone-500">Venda rápida · operador {user.email}</p></div><button onClick={()=>{if(confirm('Limpar o pedido atual?'))setCart([])}} className="text-red-700 text-xs font-bold">Limpar</button></div><div className="grid grid-cols-2 gap-2"><button onClick={()=>setOrderType('Entrega')} className={`py-3 rounded-xl font-black ${orderType==='Entrega'?'bg-amber-300':'bg-stone-100'}`}>🛵 Entrega</button><button onClick={()=>setOrderType('Retirada')} className={`py-3 rounded-xl font-black ${orderType==='Retirada'?'bg-amber-300':'bg-stone-100'}`}>🏪 Retirada</button></div><div className="grid grid-cols-2 gap-2"><input value={customerName} onChange={e=>setCustomerName(e.target.value)} placeholder="Nome do cliente" className="border rounded-xl px-3 py-3 text-sm"/><input value={customerPhone} onChange={e=>setCustomerPhone(e.target.value)} placeholder="Telefone" className="border rounded-xl px-3 py-3 text-sm"/></div>{orderType==='Entrega'&&<input value={address} onChange={e=>setAddress(e.target.value)} placeholder="Endereço de entrega" className="border rounded-xl px-3 py-3 text-sm"/>}<div className="flex-1 overflow-y-auto min-h-24 space-y-2">{cart.map(i=><div key={i.id} className="border rounded-xl p-3"><div className="flex justify-between gap-2"><div><b>{i.quantity}× {i.name}</b>{i.addons.length>0&&<p className="text-xs text-stone-500">+ {i.addons.map(a=>`${a.name} (${money(a.price)})`).join(', ')}</p>}{i.note&&<p className="text-xs text-red-700">Obs: {i.note}</p>}</div><b>{money(i.price*i.quantity)}</b></div><div className="flex justify-end gap-2 mt-2"><button onClick={()=>setCart(x=>x.map(a=>a.id===i.id?{...a,quantity:a.quantity-1}:a).filter(a=>a.quantity>0))} className="rounded-lg bg-stone-100 w-8 h-8">−</button><button onClick={()=>setCart(x=>x.map(a=>a.id===i.id?{...a,quantity:a.quantity+1}:a))} className="rounded-lg bg-stone-100 w-8 h-8">+</button></div></div>)}{cart.length===0&&<div className="h-full min-h-24 grid place-items-center text-stone-400 text-sm">Selecione produtos para começar</div>}</div><div className="border-t pt-3 space-y-2 text-sm"><div className="flex justify-between"><span>Subtotal</span><b>{money(cartSubtotal)}</b></div><div className="flex justify-between"><span>Entrega</span><b>{money(cartFee)}</b></div><div className="flex justify-between text-xl font-black border-t pt-2"><span>Total</span><span>{money(cartTotal)}</span></div></div><div className="grid grid-cols-3 gap-2">{['Pix','Cartão','Dinheiro'].map(m=><button key={m} onClick={()=>setPayment(m)} className={`py-3 rounded-xl font-black ${payment===m?'bg-stone-900 text-white':'bg-stone-100'}`}>{m}</button>)}</div><button disabled={busy||!cart.length} onClick={submitOrder} className="w-full py-4 rounded-xl bg-green-600 hover:bg-green-700 disabled:opacity-40 text-white font-black text-lg">{busy?'Salvando…':'✅ Confirmar pedido'}</button></aside></div>}
  {tab==='orders'&&<section><div className="flex flex-wrap justify-between items-end gap-3 mb-5"><div><h2 className="text-2xl font-black">Fila de pedidos</h2><p className="text-sm text-stone-500">Atualiza em tempo real · {activeOrders.length} em andamento</p></div><input value={orderSearch} onChange={e=>setOrderSearch(e.target.value)} placeholder="Buscar cliente, telefone ou ID" className="border rounded-xl px-4 py-3 w-80"/></div><div className="flex gap-2 overflow-x-auto pb-4">{[['todos','Todos'],['pendente','Novos'],['preparando','Cozinha'],['finalizado','Prontos'],['cancelado','Cancelados']].map(([v,l])=><button key={v} onClick={()=>setOrderFilter(v)} className={`px-5 py-3 rounded-xl font-black whitespace-nowrap ${orderFilter===v?'bg-stone-900 text-white':'bg-white border'}`}>{l}{v!=='todos'&&<span className="ml-2 opacity-60">{statusCount(v)}</span>}</button>)}</div><div className="grid grid-cols-1 2xl:grid-cols-2 gap-4">{filteredOrders.map(o=>{const age=Math.floor((Date.now()-Number(o.createdAt||Date.now()))/60000);return <article key={o.id} className="order-card bg-white rounded-2xl border shadow-sm p-5"><div className="flex justify-between gap-3"><div><div className="flex items-center gap-2"><h3 className="font-black text-xl">{o.customerName||'Cliente'} <span className="text-sm text-stone-400">#{o.id.slice(0,5).toUpperCase()}</span></h3><span className={`rounded-full px-3 py-1 text-xs font-black ${o.status==='pendente'?'bg-amber-100 text-amber-800':o.status==='preparando'?'bg-blue-100 text-blue-800':o.status==='finalizado'?'bg-green-100 text-green-800':'bg-red-100 text-red-800'}`}>{o.status}</span></div><p className="text-sm text-stone-500 mt-1">{o.customerPhone||''} · {dateTime(o.createdAt)} · há {age} min</p><p className="text-sm text-stone-600 mt-1">{o.customerAddress||''}</p></div><b className="text-xl whitespace-nowrap">{money(o.total)}</b></div><div className="my-4 bg-stone-50 rounded-xl p-3 space-y-2">{(o.items||[]).map((i,n)=><div key={n} className="flex justify-between text-sm"><div><b>{i.quantity}× {i.name}</b>{i.isGift&&<span className="ml-2 text-green-700 font-black">🎁 BRINDE</span>}{i.addons?.length>0&&<div className="text-xs text-stone-500">+ {i.addons.map(a=>`${a.name} (${money(a.price)})`).join(', ')}</div>}{i.note&&<div className="text-xs text-red-700 font-bold">Obs: {i.note}</div>}</div><b>{i.isGift?`Brinde · ${money(i.originalPrice||i.giftValue||0)}`:money(Number(i.price||0)*Number(i.quantity||1))}</b></div>)}<div className="border-t pt-2 text-xs space-y-1">{Number(o.discountAmount||0)>0&&<div className="flex justify-between text-green-700"><span>Desconto {o.couponCode}</span><b>− {money(o.discountAmount)}</b></div>}<div className="flex justify-between"><span>Subtotal · {o.paymentMethod||'Pix'}</span><b>{money(o.subtotal||0)}</b></div><div className="flex justify-between"><span>Entrega</span><b>{money(o.deliveryFee||0)}</b></div></div></div><div className="flex flex-wrap gap-2"><button onClick={()=>printTicket(o)} className="px-4 py-3 rounded-xl bg-stone-100 font-bold">🖨️ Imprimir</button>{o.status==='pendente'&&<button onClick={()=>updateStatus(o,'preparando')} className="px-5 py-3 rounded-xl bg-amber-300 font-black">Iniciar preparo</button>}{o.status==='preparando'&&<button onClick={()=>motoboys.length?setDispatchOrder(o):finishOrder(o,null)} className="px-5 py-3 rounded-xl bg-green-600 text-white font-black">Despachar / pronto</button>}{!['cancelado','finalizado'].includes(o.status)&&<button onClick={()=>cancelOrder(o)} className="px-4 py-3 rounded-xl bg-red-50 text-red-700 font-bold">Cancelar</button>}{o.status!=='cancelado'&&<details className="relative"><summary className="list-none px-4 py-3 rounded-xl bg-green-50 text-green-800 font-bold">🎁 Brinde</summary><div className="absolute z-10 right-0 top-12 bg-white border shadow-xl p-2 rounded-xl w-56 max-h-60 overflow-auto">{products.filter(p=>!p.paused).map(p=><button key={p.id} onClick={()=>addGift(o,p)} className="w-full p-2 text-left hover:bg-green-50 text-sm">{p.name} · {money(p.price)}</button>)}</div></details>}</div></article>})}</div>{filteredOrders.length===0&&<div className="bg-white rounded-2xl p-12 text-center text-stone-500">Nenhum pedido neste filtro.</div>}</section>}
  {tab==='cash'&&<section className="max-w-5xl mx-auto space-y-5"><div className="flex justify-between items-end"><div><h2 className="text-2xl font-black">Caixa</h2><p className="text-sm text-stone-500">Abertura, movimentações e conferência</p></div>{currentCash?<span className="bg-green-100 text-green-800 rounded-full px-4 py-2 font-black">ABERTO · {new Date(currentCash.openedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>:<span className="bg-stone-200 rounded-full px-4 py-2 font-black">FECHADO</span>}</div>{!currentCash?<form onSubmit={openCash} className="bg-white border rounded-2xl p-6 space-y-4"><h3 className="font-black text-lg">Abrir caixa</h3><label className="block text-sm">Troco inicial<input type="number" min="0" step="0.01" value={openingChange} onChange={e=>setOpeningChange(e.target.value)} className="block mt-1 w-full border rounded-xl px-4 py-3"/></label><button className="bg-green-600 text-white px-6 py-3 rounded-xl font-black">🔓 Abrir caixa</button></form>:<><div className="grid grid-cols-2 lg:grid-cols-4 gap-3">{[['Vendas',totals.sales],['Pix',totals.pix],['Cartão',totals.card],['Dinheiro',totals.cash]].map(([l,n])=><div key={l} className="bg-white border rounded-2xl p-5"><span className="text-sm text-stone-500">{l}</span><b className="block text-2xl mt-1">{money(n)}</b></div>)}</div><section className="bg-blue-50 border border-blue-200 rounded-2xl p-5"><h3 className="font-black text-lg text-blue-900">🛵 Acerto de entregadores</h3>{Object.keys(motoboyStats).length?Object.entries(motoboyStats).map(([name,x])=><div key={name} className="border-t border-blue-200 mt-3 pt-3 text-sm"><div className="flex justify-between"><b>{name}</b><span>{x.count} entrega(s)</span></div><div className="flex justify-between"><span>Dinheiro recebido</span><b>{money(x.cash)}</b></div><div className="flex justify-between"><span>Taxas do entregador</span><b>− {money(x.fees)}</b></div><div className="flex justify-between border-t border-blue-200 mt-1 pt-1 font-black"><span>Acerto líquido</span><span>{money(x.cash-x.fees)}</span></div></div>):<p className="text-sm text-blue-700 mt-2">Nenhuma entrega atribuída a entregador nesta sessão.</p>}</section><div className="grid lg:grid-cols-2 gap-4"><form onSubmit={addWithdrawal} className="bg-white border rounded-2xl p-5 space-y-3"><h3 className="font-black">💸 Registrar retirada</h3><input value={withdrawReason} onChange={e=>setWithdrawReason(e.target.value)} placeholder="Motivo da retirada" className="w-full border rounded-xl px-3 py-3"/><div className="flex gap-2"><input type="number" min="0.01" step="0.01" value={withdrawAmount} onChange={e=>setWithdrawAmount(e.target.value)} placeholder="Valor R$" className="flex-1 border rounded-xl px-3 py-3"/><button className="bg-stone-900 text-white rounded-xl px-5 font-black">Registrar</button></div><div className="space-y-2">{(currentCash.withdrawals||[]).map(w=><div key={w.id} className="border-t pt-2 flex justify-between text-sm"><span>{w.reason} · {new Date(w.createdAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span><span className="flex gap-3"><b className={w.voided?'line-through text-stone-400':'text-red-700'}>{w.voided?'Estornada':`− ${money(w.amount)}`}</b>{!w.voided&&<button type="button" onClick={()=>voidWithdrawal(w)} className="text-red-700">Estornar</button>}</span></div>)}</div></form><form onSubmit={closeCash} className="bg-white border rounded-2xl p-5 space-y-3"><h3 className="font-black">🔒 Conferência e fechamento</h3><div className="flex justify-between"><span>Troco inicial</span><b>{money(currentCash.openingChange)}</b></div><div className="flex justify-between"><span>Vendas em dinheiro</span><b>{money(totals.cash)}</b></div><div className="flex justify-between text-red-700"><span>Retiradas válidas</span><b>− {money(withdrawn)}</b></div><div className="flex justify-between border-t pt-2 text-lg font-black"><span>Esperado na gaveta</span><span>{money(expected)}</span></div><input type="number" min="0" step="0.01" required value={countedCash} onChange={e=>setCountedCash(e.target.value)} placeholder="Dinheiro contado" className="w-full border rounded-xl px-3 py-3"/><input value={closingNote} onChange={e=>setClosingNote(e.target.value)} placeholder="Observação (opcional)" className="w-full border rounded-xl px-3 py-3"/><button type="button" onClick={printCurrentCashReport} className="w-full bg-stone-900 text-white py-3 rounded-xl font-black">🖨️ Imprimir relatório da sessão</button><button className="w-full bg-red-700 text-white py-3 rounded-xl font-black">Fechar caixa</button></form></div></>}</section>}
  </main>
  {dispatchOrder&&<div className="fixed inset-0 bg-black/50 z-40 grid place-items-center p-4"><div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-3"><div className="flex justify-between"><div><h3 className="text-xl font-black">Despachar pedido</h3><p className="text-sm text-stone-500">{dispatchOrder.customerName}</p></div><button onClick={()=>setDispatchOrder(null)} className="text-2xl">×</button></div>{motoboys.map(m=><button key={m} onClick={()=>finishOrder(dispatchOrder,m)} className="w-full text-left p-4 bg-blue-50 border rounded-xl font-bold">🛵 Entregador: {m}</button>)}<button onClick={()=>finishOrder(dispatchOrder,null)} className="w-full p-4 bg-stone-900 text-white rounded-xl font-black">Retirada / sem entregador</button></div></div>}
  {selectedProduct&&<div className="fixed inset-0 bg-black/50 z-40 grid place-items-center p-4"><div className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4"><div className="flex justify-between"><div><h3 className="text-xl font-black">{selectedProduct.name}</h3><p className="text-stone-500">Preço base {money(selectedProduct.price)}</p></div><button onClick={()=>setSelectedProduct(null)} className="text-2xl">×</button></div>{addons.length>0&&<div className="max-h-56 overflow-y-auto space-y-2">{addons.map(a=><label key={a.id} className="flex justify-between p-3 bg-stone-50 rounded-xl"><span><input type="checkbox" checked={!!selectedAddons[a.id]} onChange={e=>setSelectedAddons(x=>({...x,[a.id]:e.target.checked}))}/> <b className="ml-2">{a.name}</b></span><b>{money(a.price)}</b></label>)}</div>}<textarea value={itemNote} onChange={e=>setItemNote(e.target.value)} placeholder="Observação do item" className="w-full border rounded-xl p-3"/><div className="flex justify-between items-center"><b>Total do item: {money(Number(selectedProduct.price||0)+addons.filter(a=>selectedAddons[a.id]).reduce((s,a)=>s+Number(a.price||0),0))}</b><button onClick={addCartItem} className="bg-amber-400 px-6 py-3 rounded-xl font-black">Adicionar</button></div></div></div>}
  {toast&&<div className="fixed bottom-5 right-5 z-50 bg-stone-900 text-white px-5 py-4 rounded-xl shadow-xl">{toast}</div>}
 </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
